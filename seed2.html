<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NZ Explorer trip upload 2</title>
<style>body{font-family:system-ui,sans-serif;max-width:480px;margin:32px auto;padding:0 16px;line-height:1.5}input,button{font:inherit;padding:10px;width:100%;margin:6px 0;box-sizing:border-box}button{background:#000;color:#fff;border:0;border-radius:8px}pre{background:#f0f0f0;padding:10px;white-space:pre-wrap}</style>
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head><body>
<h1>Upload trips</h1>
<p>One off page for the site owner. Sign in with your verified University email, then upload the 12 planned trips for the first five activities. Delete this file from GitHub afterwards.</p>
<input id="em" type="email" placeholder="University email" autocomplete="email">
<input id="pw" type="password" placeholder="Password" autocomplete="current-password">
<button id="go">Sign in and upload trips</button>
<pre id="out">Waiting.</pre>
<script>
var TRIPS = [{"id": "S01", "activityId": "A01", "date": "2026-10-17", "time": "09:00", "meeting": "Downtown Ferry Terminal, Quay St", "tbc": false, "max": 8, "womenOnly": false}, {"id": "S02", "activityId": "A01", "date": "2026-10-25", "time": "09:00", "meeting": "Downtown Ferry Terminal, Quay St", "tbc": false, "max": 8, "womenOnly": true}, {"id": "S03", "activityId": "A01", "date": "2026-10-31", "time": "09:00", "meeting": "Downtown Ferry Terminal, Quay St", "tbc": false, "max": 8, "womenOnly": false}, {"id": "S04", "activityId": "A02", "date": "2026-10-18", "time": "10:00", "meeting": "Britomart, city centre", "tbc": false, "max": 8, "womenOnly": false}, {"id": "S05", "activityId": "A02", "date": "2026-10-24", "time": "10:00", "meeting": "Britomart, city centre", "tbc": false, "max": 8, "womenOnly": false}, {"id": "S06", "activityId": "A02", "date": "2026-11-01", "time": "10:00", "meeting": "Britomart, city centre", "tbc": false, "max": 8, "womenOnly": false}, {"id": "S07", "activityId": "A03", "date": "2026-10-17", "time": "13:00", "meeting": "Downtown Ferry Terminal, Quay St", "tbc": false, "max": 8, "womenOnly": false}, {"id": "S08", "activityId": "A03", "date": "2026-11-01", "time": "10:30", "meeting": "Downtown Ferry Terminal, Quay St", "tbc": false, "max": 8, "womenOnly": true}, {"id": "S09", "activityId": "A04", "date": "2026-10-18", "time": "09:30", "meeting": "Downtown Ferry Terminal, Quay St", "tbc": false, "max": 8, "womenOnly": false}, {"id": "S10", "activityId": "A04", "date": "2026-10-31", "time": "09:30", "meeting": "Downtown Ferry Terminal, Quay St", "tbc": false, "max": 8, "womenOnly": false}, {"id": "S11", "activityId": "A05", "date": "2026-10-24", "time": "09:00", "meeting": "University of Auckland, City Campus", "tbc": false, "max": 8, "womenOnly": false}, {"id": "S12", "activityId": "A05", "date": "2026-10-31", "time": "09:00", "meeting": "University of Auckland, City Campus", "tbc": false, "max": 8, "womenOnly": false}];
var out=document.getElementById("out");function log(t){out.textContent+="\n"+t}
firebase.initializeApp(window.FIREBASE_CONFIG);
document.getElementById("go").onclick=function(){
  out.textContent="Signing in...";
  firebase.auth().signInWithEmailAndPassword(document.getElementById("em").value.trim(),document.getElementById("pw").value).then(function(c){
    if(!c.user.emailVerified){throw new Error("This account is not verified yet.")}
    return c.user.getIdToken(true);
  }).then(function(){
    var db=firebase.firestore(),batch=db.batch();
    TRIPS.forEach(function(t){var id=t.id;var d=Object.assign({},t);delete d.id;batch.set(db.collection("trips").doc(id),d)});
    return batch.commit();
  }).then(function(){log("Done. "+TRIPS.length+" trips uploaded.")}).catch(function(e){log("Failed: "+(e.code||"")+" "+e.message)});
};
</script></body></html>
