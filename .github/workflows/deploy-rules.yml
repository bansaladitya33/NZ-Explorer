name: Publish Firestore rules

on:
  push:
    branches: [main]
    paths: ["firestore.rules", "reminders/deploy-rules.js", ".github/workflows/deploy-rules.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
        working-directory: reminders
      - name: Publish rules
        run: node deploy-rules.js
        working-directory: reminders
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
