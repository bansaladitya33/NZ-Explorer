name: Publish Firestore rules

on:
  push:
    branches: [main]
    paths: ["firestore.rules"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Write the Firebase key to a temporary file
        run: printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Publish rules
        run: npx --yes firebase-tools@13.29.1 deploy --only firestore:rules --project nz-explorer-8001c --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
