<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NZ Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:0;
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#000000; --muted:#4D4D4D; --line:#D2D2D2;
  --accent:#000000; --accent-ink:#FFFFFF; --soft:#F0F0F0;
  --head:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#0D0D0D; --ink:#FFFFFF; --muted:#ABABAB; --line:#363636;
    --accent:#FFFFFF; --accent-ink:#000000; --soft:#1A1A1A;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#0D0D0D; --ink:#FFFFFF; --muted:#ABABAB; --line:#363636;
  --accent:#FFFFFF; --accent-ink:#000000; --soft:#1A1A1A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--head);line-height:1.12;margin:0;letter-spacing:-0.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.shell{width:100%;max-width:560px;margin:0 auto;flex:1;padding:0 20px 28px;position:relative}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:16px 0 4px;font-family:var(--head);font-weight:700;font-size:18px}
.topbar>span{display:flex;align-items:center}
.topbar small{font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:13px 20px;font-weight:600;font-size:16px}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* sign in */
.gate{padding-top:56px}
.gate h1{font-size:40px;margin-bottom:12px}
.gate .lede{color:var(--muted);margin-bottom:28px;max-width:44ch}
label{display:block;font-weight:600;margin-bottom:6px}
input[type=text],input[type=email]{width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
input:focus{border-color:var(--accent);outline:none}
.err{font-weight:600;margin-top:12px;border-left:4px solid var(--ink);padding-left:10px}
.demo{margin-top:16px;padding:12px 14px;border:2px solid var(--ink);border-radius:10px;color:var(--muted);font-size:15px}
.demo b{color:var(--ink);font-size:18px;letter-spacing:.12em}
.mark{display:block;width:190px;max-width:62%;height:auto;margin-bottom:28px;mix-blend-mode:multiply}
.mini{width:46px;height:auto;vertical-align:middle;margin-right:10px;mix-blend-mode:multiply}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mark,:root:not([data-theme="light"]) .mini{mix-blend-mode:screen}}
:root[data-theme="dark"] .mark,:root[data-theme="dark"] .mini{mix-blend-mode:screen}
.fine{font-size:13px;color:var(--muted);margin-top:28px;max-width:46ch}

/* home */
.hero{position:relative;padding:36px 0 28px;overflow:hidden}
.hero svg{position:absolute;right:-90px;top:-10px;width:420px;height:420px;z-index:0;pointer-events:none}
.hero svg path{fill:none;stroke:var(--line);stroke-width:1.5}
.hero>*:not(svg){position:relative;z-index:1}
.hero h1{font-size:44px;max-width:11ch;margin-bottom:16px}
.hero p{color:var(--muted);max-width:42ch;margin-bottom:24px}
.points{border-top:2px solid var(--ink);margin-top:8px}
.points div{padding:18px 0;border-bottom:1px solid var(--line)}
.points h3{font-size:20px;margin-bottom:4px}
.points p{color:var(--muted)}
.note{margin-top:22px;padding:16px 18px;background:var(--soft);border-radius:10px;font-size:14px}

/* list */
.pagehead{padding:28px 0 12px}
.pagehead h1{font-size:34px;margin-bottom:6px}
.pagehead p{color:var(--muted)}
.row{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left-width:6px;border-radius:6px;padding:16px 16px 14px;margin-top:12px}
.row{border-left-color:var(--ink)}
.row h3{font-size:20px;margin-bottom:6px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--muted);font-size:14px}
.bars{display:inline-flex;gap:3px;vertical-align:middle;margin-right:6px}
.bars i{width:6px;height:14px;border-radius:2px;background:var(--line)}
.bars i.on{background:var(--ink)}
.tag{background:var(--soft);border-radius:999px;padding:2px 10px;font-size:13px;color:var(--ink)}
.preview{margin-top:20px;padding:14px 16px;border:2px dashed var(--line);border-radius:10px;font-size:14px;color:var(--muted)}
.preview .btn{margin-top:10px;padding:9px 14px;font-size:14px}

/* detail */
.back{margin-top:18px}
.detail h1{font-size:32px;margin:14px 0 10px}
.detail .desc{font-size:18px;margin-bottom:16px}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;padding:14px 0;border-top:2px solid var(--ink);border-bottom:1px solid var(--line);margin-bottom:8px}
.section{padding:16px 0;border-bottom:1px solid var(--line)}
.section h2{font-size:20px;margin-bottom:8px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:15px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.missing{color:var(--muted);font-style:italic}

/* guide */
.guide h2{font-size:24px;margin:28px 0 10px}
.guide ul,.guide ol{padding-left:20px;margin:8px 0}
.guide li{margin:6px 0}
.status{width:100%;border-collapse:collapse;font-size:15px;margin-top:6px}
.status td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.status td:last-child{text-align:right;font-weight:600;white-space:nowrap;padding-left:12px}
.ok{color:var(--ink)}.warn{color:var(--muted)}.stop{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.callout{padding:14px 16px;background:var(--soft);border-radius:10px;margin:12px 0;font-size:15px}


/* tap targets and new components */
.linkbtn{min-height:44px;padding:10px 0}
.btn{min-height:48px;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.hero{padding:22px 0 12px}
.hero h1{font-size:38px;max-width:12ch;margin-bottom:0}
.how{border:2px solid var(--ink);border-radius:10px;padding:18px;margin:6px 0 18px;background:var(--surface)}
.how h2{font-size:22px;margin-bottom:8px}
.how p+p{margin-top:10px}
.soon{color:var(--muted);font-size:15px}
.stack{display:flex;flex-direction:column;gap:12px}
.stack .btn{width:100%}
.ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.filters{margin-top:6px}
fieldset{border:0;margin:14px 0 0;padding:0;min-width:0}
legend{font-weight:600;margin-bottom:8px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border:2px solid var(--ink);border-radius:999px;background:var(--surface);color:var(--ink);font-weight:500}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.fbar{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.count{color:var(--muted);font-size:15px}
.empty{margin-top:14px;padding:20px;border:2px dashed var(--ink);border-radius:10px;text-align:center}
.srcs{margin:8px 0;padding-left:20px}
.srcs a{color:var(--ink);text-underline-offset:3px;overflow-wrap:anywhere}
.muted{color:var(--muted);font-size:14px}
details{margin-top:12px;border-top:1px solid var(--line);padding-top:4px}
summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:600}
details p{margin-top:8px}
.detail dd{overflow-wrap:anywhere}
.safety h2{font-size:22px;margin:26px 0 8px}
.safety ul{padding-left:20px;margin:8px 0}
.safety li{margin:7px 0}
.banner{background:var(--ink);color:var(--bg);border-radius:10px;padding:18px;margin-top:16px}
.banner .callbtn{display:flex;align-items:center;justify-content:center;min-height:48px;margin-top:14px;background:var(--bg);color:var(--ink);border-radius:10px;font-weight:700;text-decoration:none}
.intro{margin-top:16px}
.links{display:flex;flex-direction:column;gap:10px}
.lnk{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:56px;padding:10px 14px;border:2px solid var(--ink);border-radius:10px;color:var(--ink);text-decoration:none;background:var(--surface)}
.lnk small{display:block;color:var(--muted);font-size:13px}
.disclaimer{border:2px solid var(--ink);border-radius:10px;padding:16px;font-size:15px}
.guide ol li,.guide ul li{overflow-wrap:anywhere}

/* waves rising from the bottom */
.waves{position:relative;margin-top:auto}
.waves svg{display:block;width:100%;height:150px}
.waves .back{fill:var(--line)}
.waves .front{fill:var(--ink)}
.waves .base{background:var(--ink);height:env(safe-area-inset-bottom,0px)}
.waves.withnav .base{height:calc(62px + env(safe-area-inset-bottom,0px))}
/* nav */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);background:var(--ink);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;border:0;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:500;color:var(--bg);opacity:.65}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current=page]{opacity:1;font-weight:600}
nav{border-top:0}
.hidden{display:none}
@media (prefers-reduced-motion:no-preference){.view{animation:in .18s ease-out}@keyframes in{from{opacity:0}to{opacity:1}}}
</style>
</head>
<body>
<div class="shell" id="app"></div>
<div class="waves" id="waves" aria-hidden="true">
  <svg viewBox="0 0 1440 160" preserveAspectRatio="none">
    <path class="back" d="M0,70 C220,10 430,120 720,75 S1190,5 1440,60 L1440,161 L0,161 Z"/>
    <path class="front" d="M0,112 C250,55 470,150 770,108 S1230,45 1440,98 L1440,161 L0,161 Z"/>
  </svg>
  <div class="base"></div>
</div>
<nav id="nav" class="hidden" aria-label="Main">
  <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>Home</button>
  <button data-tab="activities"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Activities</button>
  <button data-tab="safety"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>Safety</button>
  <button data-tab="guide"><svg viewBox="0 0 24 24"><path d="M9 4h6v3H9zM6 5h3M15 5h3v16H6V5"/><path d="M9 12h6M9 16h4"/></svg>Build guide</button>
</nav>

      safety:"Historic tunnels with darkness, holes, sudden drops and uneven surfaces. Weather exposure on the headland. Take care around tunnels and fortifications, use a torch in dark areas, stay on recognised routes and avoid climbing on historic structures."
    },
    {
      name:"Beachlands to Maraetai Coastal Walkway",
      desc:"A coastal walkway connecting Beachlands and Maraetai with Hauraki Gulf views, beaches and several places to stop along the route.",
      dur:"1.5 hours", hours:1.5, diff:"Easy", area:"East Auckland",
      t:{mode:"Ferry (Fullers360)", route:"Downtown Ferry Terminal to Pine Harbour Marina", time:"35 min", fare:"$13.80 one way", source:"ferrytimetable.co.nz/pine harbour marina"},
      w:{backup:"UXBRIDGE Arts & Culture, Howick",
         why:"This is an exposed coastal route. Auckland Council notes that it includes small unsealed sections that may become muddy after wet weather.",
         whyBackup:"UXBRIDGE is an indoor arts and culture venue in Howick, providing an East Auckland alternative when the coastal walk is unsuitable.",
         src:[["Auckland Council: Beachlands to Maraetai path","https://www.aucklandcouncil.govt.nz/en/parks-recreation/get-outdoors/aklpaths/path-detail/102.html"],["UXBRIDGE: Galleries","https://uxbridge.org.nz/galleries/our-galleries/"]]},
      safety:"Coastal exposure to sun, wind and rain. Cyclists sharing parts of the path. Slippery rocks or wet surfaces near the shoreline. Drowning risk if swimming in unsafe conditions. Wear suitable shoes and sun or rain protection, stay aware of other path users, take extra care near the shoreline, and check local conditions before swimming."
    },
    {
      name:"Auckland Coast-to-Coast Walkway",
      desc:"An urban cross city walk linking Waitemata and Manukau Harbours and passing major parks and volcanic landmarks including Auckland Domain, Maungawhau / Mt Eden and Maungakiekie / One Tree Hill.",
      dur:"5 to 6 hours", hours:6, diff:"Hard", area:"Central Auckland",
      t:{mode:"Walk (no transport needed)", route:"City Campus to Auckland Domain (walkway start)", time:"About 15 to 20 min walk", fare:"$0", source:"General knowledge of campus location"},
      w:{backup:"Auckland Museum, Auckland Domain",
         why:"This is a 16 km outdoor route through city streets and parks, so heavy rain, strong wind or heat can materially affect comfort and completion.",
         whyBackup:"Auckland Museum is an indoor attraction in Auckland Domain, directly on or close to the Coast-to-Coast route, so the change requires little extra travel.",
         src:[["Auckland Council: Coast-to-Coast path","https://www.aucklandcouncil.govt.nz/en/parks-recreation/get-outdoors/aklpaths/path-detail/384.html"],["Auckland Museum: Visit","https://www.aucklandmuseum.com/visit"]]},
      safety:"Fatigue and dehydration on the full 16 km route. Road crossings and busy urban sections. Steep volcanic summit sections with slip and fall risk. Wear comfortable walking shoes, carry water, sunscreen and snacks, use marked pedestrian crossings, and complete only a shorter section if not confident walking the full distance."
    }
  ];

  var DUR = ["Any","Under 2 hours","Half day (2 to 4 hours)","Full day (4+ hours)"];
  var DIFF = ["Any","Easy","Moderate","Hard"];
  function band(h){return h<2?DUR[1]:(h<=4?DUR[2]:DUR[3])}
  A.forEach(function(a){a.band=band(a.hours)});

  var LINKS = [
    ["Land Safety Code","AdventureSmart (NZ Search and Rescue Council)","https://www.adventuresmart.nz/land/the-land-safety-code"],
    ["Water Safety Code","AdventureSmart / Water Safety NZ","https://www.adventuresmart.nz/water/the-water-safety-code"],
    ["Plan a safe walk","NZ Mountain Safety Council","https://www.mountainsafety.org.nz/learn/resources/land-safety-code"],
    ["Know before you go","Department of Conservation","https://www.doc.govt.nz/parks-and-recreation/know-before-you-go/"],
    ["Is the beach safe to swim?","Safeswim (Auckland Council)","https://www.safeswim.org.nz"],
    ["UoA emergency and support","University of Auckland","https://www.auckland.ac.nz/en/students/student-support/personal-support/student-health-counselling/emergency-information.html"]
  ];

  var state = {user:null, step:"email", code:null, email:"", error:"", tab:"home", sel:null, f:{dur:"Any",diff:"Any"}};
  var app = document.getElementById("app");
  var nav = document.getElementById("nav");
  var waves = document.getElementById("waves");

  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function lvl(d){d=(d||"").toLowerCase();return d==="easy"?1:d==="moderate"?2:d==="hard"?3:0}
  function bars(d){var n=lvl(d),h="";for(var i=1;i<=3;i++)h+='<i class="'+(i<=n?"on":"")+'"></i>';return '<span class="bars" aria-hidden="true">'+h+'</span>'}
  function validEmail(e){return /^[^\s@]+@aucklanduni\.ac\.nz$/i.test(e.trim())}

  /* ---------- sign in ---------- */
  function renderGate(){
    nav.classList.add("hidden");waves.classList.remove("withnav");
    var h='<div class="gate view"><img class="mark" src="'+LOGO+'" alt="NZ Explorer logo, a silver fern in black and white"><h1>NZ Explorer</h1><p class="lede">Weekend outings around Auckland, planned for students without a car. Open to University of Auckland students only.</p>';
    if(state.step==="email"){
      h+='<label for="em">University email</label><input id="em" type="email" autocomplete="email" placeholder="abcd123'+DOMAIN+'" value="'+esc(state.email)+'">';
      if(state.error)h+='<p class="err" role="alert">'+esc(state.error)+'</p>';
      h+='<div style="margin-top:16px"><button class="btn" id="send">Send me a code</button></div>';
    } else {
      h+='<p style="margin-bottom:14px">Enter the 6 digit code for <b>'+esc(state.email)+'</b>.</p><label for="cd">Code</label><input id="cd" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code">';
      if(state.error)h+='<p class="err" role="alert">'+esc(state.error)+'</p>';
      h+='<div class="demo">Your code: <b>'+state.code+'</b></div>';
      h+='<div style="margin-top:16px;display:flex;gap:12px;align-items:center"><button class="btn" id="verify">Sign in</button><button class="linkbtn" id="back">Use a different email</button></div>';
    }
    h+='<p class="fine">Access is limited to University of Auckland students with an '+DOMAIN+' email address.</p></div>';
    app.innerHTML=h;
    var em=document.getElementById("em");
    if(em){
      em.addEventListener("keydown",function(e){if(e.key==="Enter")send()});
      document.getElementById("send").onclick=send;
    } else {
      var cd=document.getElementById("cd");
      cd.addEventListener("keydown",function(e){if(e.key==="Enter")verify()});
      document.getElementById("verify").onclick=verify;
      document.getElementById("back").onclick=function(){state.step="email";state.error="";renderGate()};
      cd.focus();
    }
    function send(){
      var v=document.getElementById("em").value.trim();state.email=v;
      if(!validEmail(v)){state.error="NZ Explorer is only open to University of Auckland students. Please use your "+DOMAIN+" address.";renderGate();return}
      state.error="";state.code=String(Math.floor(100000+Math.random()*900000));state.step="code";renderGate();
    }
    function verify(){
      var v=document.getElementById("cd").value.trim();
      if(v!==state.code){state.error="That code does not match. Please try again.";renderGate();return}
      state.user=state.email;state.error="";state.tab="home";render();
    }
  }

  /* ---------- shared pieces ---------- */
  function topbar(){return '<div class="topbar"><span><img class="mini" src="'+LOGO+'" alt="">NZ Explorer</span><small>'+esc(state.user)+' <button class="linkbtn" id="out">Sign out</button></small></div>'}
  function kv(rows){
    var h='<dl class="kv">';
    rows.forEach(function(r){h+='<dt>'+esc(r[0])+'</dt><dd>'+r[1]+'</dd>'});
    return h+'</dl>';
  }
  var SHIELD='<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>';

  /* ---------- home (Ref 8 text from Story 8) ---------- */
  function homeView(){
    return '<div class="view">'+topbar()+
    '<section class="hero"><svg viewBox="0 0 420 420" aria-hidden="true"><path d="M60 230C40 130 140 40 240 60S390 150 360 250 250 390 150 360 70 310 60 230Z"/><path d="M95 225C80 145 160 78 238 92S350 160 328 240 238 350 160 330 108 290 95 225Z"/><path d="M130 220C120 165 175 120 232 130S312 175 296 232 232 312 178 298 140 262 130 220Z"/><path d="M168 215C162 185 195 160 228 166S276 192 266 224 228 272 198 262 172 240 168 215Z"/></svg>'+
    '<h1>A free Saturday, planned without a car.</h1></section>'+
    '<section class="how"><h2>How it works</h2>'+
    '<p>NZ Explorer is a place for University of Auckland students to find weekend activities near Auckland. Each activity includes transport options, weather notes, and safety information.</p>'+
    '<p class="soon">Coming soon: signal interest in an activity to find other students to join you.</p></section>'+
    '<div class="stack"><button class="btn" data-go="activities">Browse activities</button>'+
    '<button class="btn ghost" data-go="safety">'+SHIELD+'Safety &amp; Disclaimer</button></div></div>';
  }

  /* ---------- activities with filters (Ref 7) ---------- */
  function matches(a){return (state.f.dur==="Any"||a.band===state.f.dur)&&(state.f.diff==="Any"||a.diff===state.f.diff)}
  function chips(key,opts){
    var h='<div class="chips">';
    opts.forEach(function(o){h+='<button class="chip" data-f="'+key+'" data-v="'+esc(o)+'" aria-pressed="'+(state.f[key]===o)+'">'+esc(o)+'</button>'});
    return h+'</div>';
  }
  function listView(){
    var h='<div class="view">'+topbar()+'<div class="pagehead"><h1>Activities</h1><p>Tap one to see how to get there.</p></div>';
    h+='<div class="filters"><fieldset><legend>Duration</legend>'+chips("dur",DUR)+'</fieldset><fieldset><legend>Difficulty</legend>'+chips("diff",DIFF)+'</fieldset>';
    var shown=A.filter(matches);
    h+='<div class="fbar"><span class="count" aria-live="polite">Showing '+shown.length+' of '+A.length+'</span><button class="linkbtn" data-clear="1">Clear filters</button></div></div>';
    if(!shown.length){
      h+='<div class="empty"><b>No activities match</b><br>Try clearing a filter.<div style="margin-top:12px"><button class="btn ghost" data-clear="1">Clear filters</button></div></div>';
    }
    shown.forEach(function(a){
      var i=A.indexOf(a);
      h+='<button class="row" data-i="'+i+'"><h3>'+esc(a.name)+'</h3><div class="meta"><span>'+bars(a.diff)+esc(a.diff)+'</span><span>'+esc(a.dur)+'</span></div></button>';
    });
    return h+'</div>';
  }

  /* ---------- detail (Refs 2, 5, 6) ---------- */
  function detailView(){
    var a=A[state.sel],t=a.t,w=a.w;
    var src='';
    w.src.forEach(function(s){src+='<li><a href="'+esc(s[1])+'" target="_blank" rel="noopener">'+esc(s[0])+'</a></li>'});
    return '<div class="view detail">'+topbar()+'<button class="linkbtn back" id="bk">Back to activities</button>'+
    '<h1>'+esc(a.name)+'</h1><p class="desc">'+esc(a.desc)+'</p>'+
    '<div class="facts meta"><span>'+bars(a.diff)+esc(a.diff)+'</span><span>'+esc(a.dur)+'</span><span class="tag">'+esc(a.band)+'</span><span class="tag">'+esc(a.area)+'</span></div>'+
    '<div class="section"><h2>Getting there</h2>'+kv([["Mode",esc(t.mode)],["Route",esc(t.route)],["Time",esc(t.time)],["Fare",esc(t.fare)],["Source",esc(t.source)]])+'</div>'+
    '<div class="section"><h2>If the weather turns</h2>'+kv([["Weather dependent","Yes"],["Backup",esc(w.backup)]])+
    '<details><summary>Why this backup, and sources</summary><p><b>Why weather matters here.</b> '+esc(w.why)+'</p><p><b>Why this backup.</b> '+esc(w.whyBackup)+'</p><ul class="srcs">'+src+'</ul><p class="muted">Checked 2 Oct 2026. Check opening hours, admission conditions, weather warnings and transport alerts before you go.</p></details></div>'+
    '<div class="section"><h2>Safety</h2><p>'+esc(a.safety)+'</p><p style="margin-top:12px"><button class="linkbtn" data-go="safety">Read the full safety guidance</button></p></div></div>';
  }

  /* ---------- safety and disclaimer (Ref 4 copy from Namua's brief) ---------- */
  function ul(items){return '<ul>'+items.map(function(i){return '<li>'+esc(i)+'</li>'}).join('')+'</ul>'}
  function safetyView(){
    var h='<div class="view safety">'+topbar()+'<div class="pagehead"><h1>Safety &amp; Disclaimer</h1></div>'+
    '<div class="banner"><p>In an emergency in New Zealand, call <b>111</b> and ask for Police, Fire or Ambulance. If you are lost or injured outdoors and have no signal, still try 111.</p><a class="callbtn" href="tel:111">Call 111 (emergency)</a></div>'+
    '<p class="intro">NZ Explorer helps you find weekend activities and other students to go with. Please read this before you go out, especially if you are meeting people you have not met before.</p>'+
    '<h2>Before you go</h2>'+ul(["Choose an activity that fits your fitness, experience and the time you have.","Check the weather forecast on the day and be ready to change plans.","Pack warm layers, water, food, sunscreen and a charged phone.","Tell a friend or flatmate where you are going, who with, and when you will be back.","For bush walks, leave your trip plan with someone you trust using the AdventureSmart Outdoors Intentions form."])+
    '<h2>When meeting students you have just met</h2>'+ul(["Meet first in a busy public place, such as a bus stop or the city centre, and travel together from there.","Share only your first name and the group chat until you feel comfortable.","Stay with the group. Do not leave anyone behind.","You can leave or say no at any time. You do not need to give a reason.","If someone makes you feel unsafe, leave, contact Police (111 in an emergency, 105 otherwise) and report it to the NZ Explorer team."])+
    '<h2>Around water and on the coast</h2>'+ul(["Check tides and water quality before you go. Swim at patrolled beaches between the flags.","Know your limits. NZ water can be colder and rougher than it looks."])+
    '<h2>Safety links</h2><div class="links">';
    LINKS.forEach(function(l){h+='<a class="lnk" href="'+esc(l[2])+'" target="_blank" rel="noopener"><span><b>'+esc(l[0])+'</b><small>'+esc(l[1])+'</small></span><span aria-hidden="true">&#8599;</span></a>'});
    h+='</div><h2>Disclaimer</h2><div class="disclaimer"><p>NZ Explorer is a student pilot project built for a University of Auckland course. It is not an official University service, tour operator or safety authority. Activity, transport and weather information is collected from public sources and checked by hand; it may be out of date or wrong, so always confirm details with the official source before you go. NZ Explorer does not organise, supervise or insure any activity, and does not screen or verify the people you meet through the app beyond the university email sign up. You take part at your own risk and are responsible for your own safety and decisions. If you are unsure about an activity or a person, do not go.</p></div></div>';
    return h;
  }

  /* ---------- build guide ---------- */
  function guideView(){
    return '<div class="view guide">'+topbar()+'<div class="pagehead"><h1>Build guide</h1><p>Where each story stands, and what the team still has to decide.</p></div>'+
    '<h2>Where each story stands</h2><table class="status">'+
    '<tr><td><b>Ref 41</b> Platform base on Glide</td><td class="stop">Blocked on plan</td></tr>'+
    '<tr><td><b>Ref 2</b> First 5 activities, with name, description, duration, difficulty and area</td><td class="ok">Content ready</td></tr>'+
    '<tr><td><b>Ref 5</b> Transport route, time, fare and source for all five</td><td class="warn">Ready, 2 to check</td></tr>'+
    '<tr><td><b>Ref 6</b> Weather dependence and a named backup for all five, checked 2 Oct</td><td class="warn">Ready, sheet to update</td></tr>'+
    '<tr><td><b>Ref 4</b> Safety and Disclaimer page, built on this site</td><td class="warn">Wording needs PO approval</td></tr>'+
    '<tr><td><b>Ref 8</b> How it works text, on Home</td><td class="ok">Text ready</td></tr>'+
    '<tr><td><b>Ref 7</b> Duration and difficulty filters, built on this site</td><td class="warn">Categories need a decision</td></tr>'+
    '<tr><td><b>Ref 3</b> Mobile display</td><td class="warn">Needs a real phone test</td></tr></table>'+
    '<h2>Where the files disagree</h2><p>These are the places where one teammate\'s file says something different from another\'s. This site follows the newer or better sourced file, and each one needs a quick team decision.</p><ol>'+
    '<li><b>Weather dependence.</b> The activities sheet marks Maungakiekie and Coast-to-Coast as not weather dependent, and its backups are parks and cafes. The Ref 6 plan marks all five as dependent and names an indoor backup for each, with sources. This site uses Ref 6, so the sheet should be updated to match.</li>'+
    '<li><b>Duration bands.</b> Ref 7 puts anything from 2 up to 4 hours in Half day, and uses the upper value of a range. By that rule Rangitoto (2 hours) and Maungakiekie (1 to 2 hours) are Half day, but the sheet calls them Short. This site follows Ref 7. Filter answers on the five activities: Under 2 hours gives 1, Half day gives 3, Full day gives 1.</li>'+
    '<li><b>Medium or Moderate.</b> The sheet says Medium and Ref 7 says Moderate, to match DOC track grades. This site shows Moderate. Filter answers: Easy gives 3, Moderate gives 1, Hard gives 1.</li>'+
    '<li><b>Beachlands transport.</b> The sheet says bus, about 1 hour. Story 5 says ferry to Pine Harbour Marina, 35 min, $13.80. This site shows the ferry, but someone needs to confirm how you get from Pine Harbour to the start of the walkway.</li>'+
    '<li><b>Coast-to-Coast transport source.</b> It says general knowledge, and the Definition of Done needs a source link and a check date. Rangitoto\'s fare is a return price while the others are one way, so label it clearly.</li>'+
    '<li><b>Home page promise.</b> The Story 8 text mentions signalling interest, but that feature is not built yet. It shows as coming soon.</li></ol>'+
    '<h2>Still missing for Ref 4</h2><ul><li>Last checked date and who checked each safety link.</li><li>Product Owner approval of the disclaimer wording.</li><li>Name of the peer checker.</li></ul>'+
    '<h2>What happened with Glide</h2><p>The data imported fine, but Glide\'s AI builder stopped with an upgrade prompt before it built any screens. Several sources say the free plan allows drafts only, with one editor and no published app, and that free AI credits do not renew. Nobody in the group has a paid account yet.</p>'+
    '<h2>Decisions on the platform</h2><ol>'+
    '<li><b>Who pays, and whose account owns the app.</b> Pick someone who will still be around on 19 October. The charter says extra spending needs Product Owner and team approval.</li>'+
    '<li><b>Which plan.</b> It must allow publishing, 7 editors and a restricted sign up. The charter budgets Glide Plus at US$50 a month for three members, which does not match 7 editors. Check the live pricing page before quoting a number.</li>'+
    '<li><b>If the plan costs more than budgeted,</b> update the charter financial table before the Week 10 demo, or switch to Softr.</li>'+
    '<li><b>Add a backlog story for UoA only sign up.</b> It is a safety decision we can justify to the lecturer, and it changes how the companion feature is tested.</li></ol>'+
    '<h2>Sign up rule</h2><ul><li>Only addresses ending in <b>'+DOMAIN+'</b> can sign up.</li><li>The inbox must be verified by an emailed code or link. A typed address alone proves nothing.</li><li>Test it with a non university address and confirm it is rejected.</li></ul>'+
    '<h2>Data sheet rules</h2><ul><li>One sheet called <b>NZ Explorer, Activities</b>, owned by one person, in a shared team folder.</li><li>Add the transport and weather columns to the sheet so Glide and this site show the same thing.</li><li>Never rename a column header without telling the group, because Glide breaks silently.</li><li>Every factual record needs a source link and a check date.</li></ul>'+
    '<h2>Rebuild steps in Glide</h2><ol><li>Create the project from the activities data.</li><li>Home page with the How it works text and a Safety and Disclaimer button.</li><li>Activities page with cards showing name, duration and difficulty, plus the two filters.</li><li>Detail page with transport, weather and safety.</li><li>Safety and Disclaimer page, in the bottom menu.</li><li>Restrict sign up to '+DOMAIN+'.</li><li>Publish, test on an iPhone and an Android phone, have a second member test it, then invite the others.</li></ol></div>';
  }

  /* ---------- shell ---------- */
  function render(){
    if(!state.user){renderGate();return}
    nav.classList.remove("hidden");waves.classList.add("withnav");
    var v=state.tab==="home"?homeView():state.tab==="guide"?guideView():state.tab==="safety"?safetyView():(state.sel!==null?detailView():listView());
    app.innerHTML=v;
    Array.prototype.forEach.call(nav.querySelectorAll("button"),function(b){
      if(b.dataset.tab===state.tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");
    });
    bind();
    window.scrollTo(0,0);
  }
  function rerenderList(){app.innerHTML=listView();bind()}
  function bind(){
    var o=document.getElementById("out");if(o)o.onclick=function(){state.user=null;state.step="email";state.email="";state.error="";state.sel=null;state.f={dur:"Any",diff:"Any"};render()};
    Array.prototype.forEach.call(app.querySelectorAll("[data-go]"),function(b){b.onclick=function(){state.tab=b.dataset.go;state.sel=null;render()}});
    Array.prototype.forEach.call(app.querySelectorAll(".row"),function(b){b.onclick=function(){state.sel=+b.dataset.i;render()}});
    Array.prototype.forEach.call(app.querySelectorAll(".chip"),function(b){b.onclick=function(){state.f[b.dataset.f]=b.dataset.v;rerenderList()}});
    Array.prototype.forEach.call(app.querySelectorAll("[data-clear]"),function(b){b.onclick=function(){state.f={dur:"Any",diff:"Any"};rerenderList()}});
    var bk=document.getElementById("bk");if(bk)bk.onclick=function(){state.sel=null;render()};
  }
  nav.addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;state.tab=b.dataset.tab;state.sel=null;render();
  });

  render();
})();

</script>

</html>
