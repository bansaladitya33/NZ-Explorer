<title>NZ Explorer</title>

<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:0;
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#000000; --muted:#4D4D4D; --line:#D2D2D2;
  --accent:#000000; --accent-ink:#FFFFFF; --soft:#F0F0F0;
  --head:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#0D0D0D; --ink:#FFFFFF; --muted:#ABABAB; --line:#363636;
    --accent:#FFFFFF; --accent-ink:#000000; --soft:#1A1A1A;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#0D0D0D; --ink:#FFFFFF; --muted:#ABABAB; --line:#363636;
  --accent:#FFFFFF; --accent-ink:#000000; --soft:#1A1A1A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--head);line-height:1.12;margin:0;letter-spacing:-0.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.shell{width:100%;max-width:560px;margin:0 auto;flex:1;padding:0 20px 28px;position:relative}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:16px 0 4px;font-family:var(--head);font-weight:700;font-size:18px}
.topbar>span{display:flex;align-items:center}
.topbar small{font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:13px 20px;font-weight:600;font-size:16px}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* sign in */
.gate{padding-top:56px}
.gate h1{font-size:40px;margin-bottom:12px}
.gate .lede{color:var(--muted);margin-bottom:28px;max-width:44ch}
label{display:block;font-weight:600;margin-bottom:6px}
input[type=text],input[type=email]{width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
input:focus{border-color:var(--accent);outline:none}
.err{font-weight:600;margin-top:12px;border-left:4px solid var(--ink);padding-left:10px}
.demo{margin-top:16px;padding:12px 14px;border:2px solid var(--ink);border-radius:10px;color:var(--muted);font-size:15px}
.demo b{color:var(--ink);font-size:18px;letter-spacing:.12em}
.mark{display:block;width:140px;max-width:50%;height:auto;margin-bottom:28px}
.mini{width:34px;height:34px;vertical-align:middle;margin-right:10px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mark,:root:not([data-theme="light"]) .mini{filter:invert(1)}}
:root[data-theme="dark"] .mark,:root[data-theme="dark"] .mini{filter:invert(1)}
.fine{font-size:13px;color:var(--muted);margin-top:28px;max-width:46ch}

/* home */
.hero{position:relative;padding:36px 0 28px;overflow:hidden}
.hero svg{position:absolute;right:-90px;top:-10px;width:420px;height:420px;z-index:0;pointer-events:none}
.hero svg path{fill:none;stroke:var(--line);stroke-width:1.5}
.hero>*:not(svg){position:relative;z-index:1}
.hero h1{font-size:44px;max-width:11ch;margin-bottom:16px}
.hero p{color:var(--muted);max-width:42ch;margin-bottom:24px}
.points{border-top:2px solid var(--ink);margin-top:8px}
.points div{padding:18px 0;border-bottom:1px solid var(--line)}
.points h3{font-size:20px;margin-bottom:4px}
.points p{color:var(--muted)}
.note{margin-top:22px;padding:16px 18px;background:var(--soft);border-radius:10px;font-size:14px}

/* list */
.pagehead{padding:28px 0 12px}
.pagehead h1{font-size:34px;margin-bottom:6px}
.pagehead p{color:var(--muted)}
.row{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left-width:6px;border-radius:6px;padding:16px 16px 14px;margin-top:12px}
.row{border-left-color:var(--ink)}
.row h3{font-size:20px;margin-bottom:6px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--muted);font-size:14px}
.bars{display:inline-flex;gap:3px;vertical-align:middle;margin-right:6px}
.bars i{width:6px;height:14px;border-radius:2px;background:var(--line)}
.bars i.on{background:var(--ink)}
.tag{background:var(--soft);border-radius:999px;padding:2px 10px;font-size:13px;color:var(--ink)}
.preview{margin-top:20px;padding:14px 16px;border:2px dashed var(--line);border-radius:10px;font-size:14px;color:var(--muted)}
.preview .btn{margin-top:10px;padding:9px 14px;font-size:14px}

/* detail */
.back{margin-top:18px}
.detail h1{font-size:32px;margin:14px 0 10px}
.detail .desc{font-size:18px;margin-bottom:16px}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;padding:14px 0;border-top:2px solid var(--ink);border-bottom:1px solid var(--line);margin-bottom:8px}
.section{padding:16px 0;border-bottom:1px solid var(--line)}
.section h2{font-size:20px;margin-bottom:8px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:15px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.missing{color:var(--muted);font-style:italic}

/* guide */
.guide h2{font-size:24px;margin:28px 0 10px}
.guide ul,.guide ol{padding-left:20px;margin:8px 0}
.guide li{margin:6px 0}
.status{width:100%;border-collapse:collapse;font-size:15px;margin-top:6px}
.status td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.status td:last-child{text-align:right;font-weight:600;white-space:nowrap;padding-left:12px}
.ok{color:var(--ink)}.warn{color:var(--muted)}.stop{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.callout{padding:14px 16px;background:var(--soft);border-radius:10px;margin:12px 0;font-size:15px}


/* tap targets and new components */
.linkbtn{min-height:44px;padding:10px 0}
.btn{min-height:48px;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.hero{padding:22px 0 12px}
.hero h1{font-size:38px;max-width:12ch;margin-bottom:0}
.how{border:2px solid var(--ink);border-radius:10px;padding:18px;margin:6px 0 18px;background:var(--surface)}
.how h2{font-size:22px;margin-bottom:8px}
.how p+p{margin-top:10px}
.soon{color:var(--muted);font-size:15px}
.stack{display:flex;flex-direction:column;gap:12px}
.stack .btn{width:100%}
.ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.filters{margin-top:6px}
fieldset{border:0;margin:14px 0 0;padding:0;min-width:0}
legend{font-weight:600;margin-bottom:8px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border:2px solid var(--ink);border-radius:999px;background:var(--surface);color:var(--ink);font-weight:500}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.gchip{min-height:44px;padding:0 16px;border:2px solid var(--ink);border-radius:999px;background:var(--surface);color:var(--ink);font-weight:500}
.gchip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.fbar{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.count{color:var(--muted);font-size:15px}
.empty{margin-top:14px;padding:20px;border:2px dashed var(--ink);border-radius:10px;text-align:center}
.srcs{margin:8px 0;padding-left:20px}
.srcs a{color:var(--ink);text-underline-offset:3px;overflow-wrap:anywhere}
.muted{color:var(--muted);font-size:14px}
details{margin-top:12px;border-top:1px solid var(--line);padding-top:4px}
summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:600}
details p{margin-top:8px}
.detail dd{overflow-wrap:anywhere}
.safety h2{font-size:22px;margin:26px 0 8px}
.safety ul{padding-left:20px;margin:8px 0}
.safety li{margin:7px 0}
.banner{background:var(--ink);color:var(--bg);border-radius:10px;padding:18px;margin-top:16px}
.banner .callbtn{display:flex;align-items:center;justify-content:center;min-height:48px;margin-top:14px;background:var(--bg);color:var(--ink);border-radius:10px;font-weight:700;text-decoration:none}
.intro{margin-top:16px}
.links{display:flex;flex-direction:column;gap:10px}
.lnk{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:56px;padding:10px 14px;border:2px solid var(--ink);border-radius:10px;color:var(--ink);text-decoration:none;background:var(--surface)}
.lnk small{display:block;color:var(--muted);font-size:13px}
.disclaimer{border:2px solid var(--ink);border-radius:10px;padding:16px;font-size:15px}
.guide ol li,.guide ul li{overflow-wrap:anywhere}
.field{margin-top:16px}
input[type=password]{width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
input[type=password]:focus{border-color:var(--accent);outline:none}
.note2{margin-top:12px;border-left:4px solid var(--ink);padding-left:10px}


.mapframe{display:block;width:100%;height:180px;border:1px solid var(--line);border-radius:10px;margin:4px 0 12px}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.btnrow .btn{flex:1 1 150px}
.alertbox{border:2px solid var(--ink);border-radius:10px;padding:12px 14px;margin:6px 0 4px;background:var(--soft);font-size:15px}
.check{padding-left:20px;margin:6px 0 12px}
.check li{margin:5px 0}
.eat{padding:10px 0;border-top:1px solid var(--line)}
.eat p{margin:2px 0}

/* waves rising from the bottom */
.waves{position:relative;margin-top:auto}
.waves svg{display:block;width:100%;height:150px}
.waves .back{fill:var(--line)}
.waves .front{fill:var(--ink)}
.waves .base{background:var(--ink);height:env(safe-area-inset-bottom,0px)}
.waves.withnav .base{height:calc(62px + env(safe-area-inset-bottom,0px))}
/* nav */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);background:var(--ink);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;border:0;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:500;color:var(--bg);opacity:.65}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current=page]{opacity:1;font-weight:600}
nav{border-top:0}
.hidden{display:none}
@media (prefers-reduced-motion:no-preference){.view{animation:in .18s ease-out}@keyframes in{from{opacity:0}to{opacity:1}}}
</style>
</head>

  var NEWACT = [["Auckland Domain & Wintergardens", "Walk through Auckland's oldest park, then visit the Domain Wintergardens: two Victorian style glasshouses (one tropical, one temperate) with a sunken fernery and courtyard.", "1 to 2 hours (est.)", 2, ["Easy"], "Central", "Short, flexible route (est. 2 to 3 km)", "Free entry, right next to the city campus, and a good low cost rainy day option because the glasshouses are indoors."], ["Maungawhau / Mt Eden Summit Walk", "Walk up the volcanic cone to the crater rim for 360 degree views over the city, harbours and Rangitoto. The crater is tapu (sacred), so visitors stay on the rim tracks.", "40 min to 1 hour", 1, ["Easy", "Moderate"], "Central", "2.1 km marked summit circuit", "Free, short and rewarding, with some of the best city views. Reachable by train (Mt Eden Station) then a short walk."], ["Tāmaki Drive Waterfront Walk (Mission Bay & St Heliers)", "Flat waterfront walk from the downtown Ferry Building past Okahu Bay and Mission Bay beach to St Heliers, with cafés, beaches and harbour views. Easy to stop partway at Mission Bay.", "Up to 2 hours one way (can stop earlier)", 2, ["Easy"], "Central East", "9.7 km one way to St Heliers", "Free, flat and scenic, with beaches and cafés along the way. Buses run along the waterfront so students can walk one way and bus back."], ["Parnell Farmers’ Market", "Saturday morning farmers' market on Parnell Road with local produce and food stalls, a short trip from the Auckland Domain.", "About 1 hour (est.)", 1, ["Easy"], "Central", "No set route (market stroll)", "Easy weekend outing close to the city, and easy to combine with a walk through the Auckland Domain."], ["Takapuna Beach & Sunday Market", "Spend a Sunday at Takapuna Beach and the Sunday market in Waiwharariki Anzac Square, with fresh produce, bakery stalls and flowers.", "2 to 3 hours (est.)", 3, ["Easy"], "North Shore", "No set route (beach and town stroll)", "Sunday only outing with a swimmable beach, market food   /* ---------- live sign in with Firebase (used only when firebase-config.js is filled in) ---------- */
  var CFG = window.FIREBASE_CONFIG || {};

  if(LIVE&&firebase.firestore){ try{ db = firebase.firestore(); }catch(err){ db=null; } }
  var GOPTS=[["female","Female"],["male","Male"],["other","Other (including prefer not to say)"]];

  function friendly(e){
    var c=(e&&e.code)||"";
    if(c==="auth/email-already-in-use")return "An account with that email already exists. Try signing in instead.";
    if(c==="auth/invalid-credential"||c==="auth/wrong-password"||c==="auth/user-not-found"||c==="auth/invalid-login-credentials")return "That email and password do not match.";
    if(c==="auth/too-many-requests")return "Too many attempts. Please wait a few minutes and try again.";
    if(c==="auth/network-request-failed")return "Network problem. Check your connection and try again.";
    if(c==="auth/unauthorized-domain")return "This site's address has not been added to Firebase yet. Add it under Authentication, Settings, Authorized domains.";
    if(c==="auth/weak-password")return "Please choose a password of at least 8 characters.";
    if(c==="auth/invalid-email")return "That email address does not look right.";
    return "Something went wrong. Please try again.";
  }
  function enter(u){
    state.user=u.email;state.uid=u.uid;state.name=u.displayName||"";state.step="email";state.mode="signin";state.error="";state.notice="";state.pending=null;state.tab="home";render();
    if(db){u.getIdToken(true).then(function(){return db.collection("users").doc(u.uid).get()}).then(function(d){
      var g=d.exists&&d.data().gender;if(g){state.gender=g}else if(!state.gender){state.gender=""}
      if(state.tab==="profile")render();
    }).catch(function(){})}
  }
  function renderLive(){

  function renderLiveSignin(){
    var h='<p class="lede">Weekend outings around Auckland, planned for students without a car. Open to University of Auckland students only.</p>'+
      '<div class="field"><label for="em">University email</label><input id="em" type="email" autocomplete="email" placeholder="abcd123'+DOMAIN+'" value="'+esc(state.email)+'"></div>'+
      '<div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"></div>';

    h+='<div style="margin-top:16px"><button class="btn" id="go">Sign in</button></div>'+
       '<p style="margin-top:6px"><button class="linkbtn" id="forgot">Forgot your password?</button></p>'+
       '<p style="margin-top:6px">New here? <button class="linkbtn" id="tosignup">Create an account</button></p>';

      grab();var pw=document.getElementById("pw").value;state.notice="";

      document.getElementById("go").disabled=true;

        var u=cred.user;

        enter(u);
      }).catch(function(e){state.error=friendly(e);renderGate()});
    }

    document.getElementById("pw").addEventListener("keydown",function(e){if(e.key==="Enter")go()});
    document.getElementById("em").addEventListener("keydown",function(e){if(e.key==="Enter")go()});

    document.getElementById("forgot").onclick=function(){
      grab();state.error="";
      if(!validEmail(state.email)){state.error="Enter your "+DOMAIN+" email above first, then tap Forgot your password.";renderGate();return}
      auth.sendPasswordResetEmail(state.email).then(function(){
        state.notice="If an account exists for that email, a reset link is on its way.";renderGate();
      }).catch(function(e){
        var c=(e&&e.code)||"";
        if(c==="auth/too-many-requests"||c==="auth/network-request-failed"){state.error=friendly(e)}
        else{state.notice="If an account exists for that email, a reset link is on its way."}
        renderGate();
      });
    };
  }

    function grab(){p.name=document.getElementById("fn").value.trim();state.email=document.getElementById("em").value.trim()}
    Array.prototype.forEach.call(app.querySelectorAll(".chip"),function(b){b.onclick=function(){grab();p.gender=b.dataset.g;renderGate()}});
    document.getElementById("tosignin").onclick=function(){grab();state.mode="signin";state.error="";renderGate()};
    document.getElementById("create").onclick=function(){
      grab();var pw=document.getElementById("pw").value;
      if(!/^[\p{L}][\p{L}\s'\u2019-]{0,39}$/u.test(p.name)){state.error="Please enter your first name.";renderGate();return}
      if(!validEmail(state.email)){state.error="NZ Explorer is only open to University of Auckland students. Please use your "+DOMAIN+" address.";renderGate();return}

      document.getElementById("create").disabled=true;

        var u=cred.user;state.gender=p.gender;
        var saveProfile=db?db.collection("users").doc(u.uid).set({name:p.name,gender:p.gender}).catch(function(){}):Promise.resolve();
        return u.updateProfile({displayName:p.name}).then(function(){return saveProfile}).then(function(){return u.sendEmailVerification()}).then(function(){
          state.pending=u;state.step="inbox";state.error="";state.notice="We sent a verification link to "+u.email+".";renderGate();

  function renderInbox(){
    var h='<h2 style="margin-top:22px;font-size:24px">Check your inbox</h2><p style="margin-top:8px">'+esc(state.notice)+' Open the link in the email, then come back here. Check your spam folder too.</p>';

  function loadTrips(a){
    var box=document.getElementById("trips");if(!box||!db)return;
    var today=new Date().toISOString().slice(0,10),col=db.collection("trips");
    var open=col.where("activityId","==",a.id).where("womenOnly","==",false).get();
    var women=col.where("activityId","==",a.id).where("womenOnly","==",true).get().then(function(r){return r},function(){return null});
    Promise.all([open,women]).then(function(res){
      var list=[];
      res.forEach(function(r,i){if(r)r.forEach(function(d){var x=d.data();x.women=(i===1);list.push(x)})});
      list=list.filter(function(x){return x.date>=today}).sort(function(p,q){return (p.date+p.time)<(q.date+q.time)?-1:1});
      if(state.sel===null||A[state.sel]!==a)return;
      if(!list.length){box.innerHTML="";return}
      var h='<h2>Planned trips</h2><p class="muted" style="margin-bottom:8px">Joining a trip is coming soon. These are the dates the team has planned.</p>';
      list.forEach(function(x){h+='<div class="eat"><p><b>'+esc(fmtDate(x.date))+', '+esc(fmtTime(x.time))+'</b>'+(x.women?' <span class="tag">Women only</span>':'')+'</p><p class="muted">Meet at '+esc(x.meeting)+(x.tbc?" (exact spot to be confirmed)":"")+'. Up to '+esc(x.max)+' students.</p></div>'});
      box.innerHTML=h;
    }).catch(function(){box.innerHTML='<h2>Planned trips</h2><p class="muted">Trips could not be loaded right now. Please try again later.</p>'});
  }
  function profileView(){
    var h='<div class="view">'+topbar()+'<div class="pagehead"><h1>Your profile</h1><p>'+esc(state.name||"")+' '+esc(state.user||"")+'</p></div><div class="field"><label id="gl2">Gender</label><div class="chips" role="group" aria-labelledby="gl2">';
    GOPTS.forEach(function(g){h+='<button type="button" class="gchip" data-g="'+g[0]+'" aria-pressed="'+(state.gender===g[0])+'">'+esc(g[1])+'</button>'});
    h+='</div><p class="muted" style="margin-top:8px">Used only to decide which trips you can see, such as women only trips. It is never shown to other students. It is self declared and not checked.</p></div>';
    if(state.gmsg)h+='<p role="status" style="margin-top:12px"><b>'+esc(state.gmsg)+'</b></p>';
    h+='<div class="stack" style="margin-top:16px"><button class="btn" id="gsave">Save</button><button class="btn ghost" data-go="home">Back to home</button></div></div>';
    return h;
  }
  function bindProfile(){
    var pick=state.gender;
    Array.prototype.forEach.call(app.querySelectorAll(".gchip"),function(b){b.onclick=function(){pick=b.dataset.g;Array.prototype.forEach.call(app.querySelectorAll(".gchip"),function(c){c.setAttribute("aria-pressed",String(c===b))})}});
    var sv=document.getElementById("gsave");
    if(sv)sv.onclick=function(){
      if(!pick||!db||!state.uid){state.gmsg="Choose an option first.";render();return}
      db.collection("users").doc(state.uid).set({name:state.name||"",gender:pick}).then(function(){state.gender=pick;state.gmsg="Saved.";render()}).catch(function(){state.gmsg="Could not save right now. Please try again.";render()});
    };
  }
  function detailView(){
    var a=A[state.sel],t=a.t,w=a.w,bs=bringSection(a);
    var h='<div class="view detail">'+topbar()+'<button class="linkbtn back" id="bk">Back to activities</button>'+
    '<h1>'+esc(a.name)+'</h1><p class="desc">'+esc(a.desc)+'</p>'+
    '<div class="facts meta"><span>'+bars(a.diff)+esc(a.diff)+'</span><span>'+esc(a.dur)+'</span><span class="tag">'+esc(a.band)+'</span><span class="tag">'+esc(a.area)+'</span>'+(a.dist?'<span class="tag">'+esc(a.dist)+'</span>':'')+'</div>';
    if(a.why)h+='<p class="muted" style="margin-bottom:8px"><b>Why it suits students.</b> '+esc(a.why)+'</p>';
    if(bs)h+=bs.banner;
    h+=locSection(a);
    if(t){
      h+='<div class="section"><h2>Getting there</h2>'+kv([["Mode",esc(t.mode)],["Route",esc(t.route)],["Time",esc(t.time)],["Fare",esc(t.fare)],["Source",esc(t.source)]])+'</div>';
    } else {
      h+='<div class="section"><h2>Getting there</h2><p>Route, time and fare are still being checked by the team for this activity. In the meantime, use the Directions by public transport button above or the '+ext("https://at.govt.nz/bus-train-ferry/journey-planner/","AT journey planner")+'.</p></div>';
    }
    if(w){
      var src='';w.src.forEach(function(s){src+='<li><a href="'+esc(s[1])+'" target="_blank" rel="noopener">'+esc(s[0])+'</a></li>'});
      h+='<div class="section"><h2>If the weather turns</h2>'+kv([["Weather dependent","Yes"],["Backup",esc(w.backup)]])+
      '<details><summary>Why this backup, and sources</summary><p><b>Why weather matters here.</b> '+esc(w.why)+'</p><p><b>Why this backup.</b> '+esc(w.whyBackup)+'</p><ul class="srcs">'+src+'</ul><p class="muted">Checked 2 Oct 2026. Check opening hours, admission conditions, weather warnings and transport alerts before you go.</p></details></div>';
    } else {
      h+='<div class="section"><h2>If the weather turns</h2><p>A weather backup for this activity is still being added. Check the forecast before you go.</p></div>';
    }
    if(bs)h+=bs.section;
    h+=foodSection(a)+tripsSection(a);
    if(a.safety){
      h+='<div class="section"><h2>Safety</h2><p>'+esc(a.safety)+'</p><p style="margin-top:12px"><button class="linkbtn" data-go="safety">Read the full safety guidance</button></p></div>';
    } else {
      h+='<div class="section"><h2>Safety</h2><p>Activity specific safety notes are still being added. Read the general safety guidance before you go.</p><p style="margin-top:12px"><button class="linkbtn" data-go="safety">Read the full safety guidance</button></p></div>';
    }
    return h+'</div>';
  }

  /* ---------- safety and disclaimer (Ref 4 copy from Namua's brief) ---------- */
  function ul(items){return '<ul>'+items.map(function(i){return '<li>'+esc(i)+'</li>'}).join('')+'</ul>'}
  function safetyView(){
    var h='<div class="view safety">'+topbar()+'<div class="pagehead"><h1>Safety &amp; Disclaimer</h1></div>'+
    '<div class="banner"><p>In an emergency in New Zealand, call <b>111</b> and ask for Police, Fire or Ambulance. If you are lost or injured outdoors and have no signal, still try 111.</p><a class="callbtn" href="tel:111">Call 111 (emergency)</a></div>'+
    '<p class="intro">NZ Explorer helps you find weekend activities and other students to go with. Please read this before you go out, especially if you are meeting people you have not met before.</p>'+
    '<h2>Before you go</h2>'+ul(["Choose an activity that fits your fitness, experience and the time you have.","Check the weather forecast on the day and be ready to change plans.","Pack warm layers, water, food, sunscreen and a charged phone.","Tell a friend or flatmate where you are going, who with, and when you will be back.","For bush walks, leave your trip plan with someone you trust using the AdventureSmart Outdoors Intentions form."])+
    '<h2>When meeting students you have just met</h2>'+ul(["Meet first in a busy public place, such as a bus stop or the city centre, and travel together from there.","Share only your first name and the group chat until you feel comfortable.","Stay with the group. Do not leave anyone behind.","You can leave or say no at any time. You do not need to give a reason.","If someone makes you feel unsafe, leave, contact Police (111 in an emergency, 105 otherwise) and report it to the NZ Explorer team."])+
    '<h2>Around water and on the coast</h2>'+ul(["Check tides and water quality before you go. Swim at patrolled beaches between the flags.","Know your limits. NZ water can be colder and rougher than it looks."])+
    '<h2>Safety links</h2><div class="links">';
    LINKS.forEach(function(l){h+='<a class="lnk" href="'+esc(l[2])+'" target="_blank" rel="noopener"><span><b>'+esc(l[0])+'</b><small>'+esc(l[1])+'</small></span><span aria-hidden="true">&#8599;</span></a>'});
    h+='</div><h2>Disclaimer</h2><div class="disclaimer"><p>NZ Explorer is a student pilot project built for a University of Auckland course. It is not an official University service, tour operator or safety authority. Activity, transport and weather information is collected from public sources and checked by hand; it may be out of date or wrong, so always confirm details with the official source before you go. NZ Explorer does not organise, supervise or insure any activity, and does not screen or verify the people you meet through the app beyond the university email sign up. You take part at your own risk and are responsible for your own safety and decisions. If you are unsure about an activity or a person, do not go.</p></div></div>';
    return h;
  }

  /* ---------- shell ---------- */
  function render(){
    if(!state.user){renderGate();return}
    nav.classList.remove("hidden");waves.classList.add("withnav");
    var v=state.tab==="home"?homeView():state.tab==="safety"?safetyView():state.tab==="profile"?profileView():(state.sel!==null?detailView():listView());
    app.innerHTML=v;
    Array.prototype.forEach.call(nav.querySelectorAll("button"),function(b){
      if(b.dataset.tab===state.tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");
    });
    bind();
    if(state.tab==="activities"&&state.sel!==null)loadTrips(A[state.sel]);
    if(state.tab==="profile")bindProfile();
    window.scrollTo(0,0);
  }
  function rerenderList(){app.innerHTML=listView();bind()}
  function bind(){
    var o=document.getElementById("out");if(o)o.onclick=function(){if(auth)auth.signOut();state.user=null;state.name="";state.mode="signin";state.step="email";state.email="";state.error="";state.profile={name:"",age:"",gender:""};state.gender="";state.uid=null;state.gmsg="";state.sel=null;state.f={dur:"Any",diff:"Any"};render()};
    Array.prototype.forEach.call(app.querySelectorAll("[data-go]"),function(b){b.onclick=function(){state.tab=b.dataset.go;state.sel=null;render()}});
    Array.prototype.forEach.call(app.querySelectorAll(".row"),function(b){b.onclick=function(){state.sel=+b.dataset.i;render()}});
    Array.prototype.forEach.call(app.querySelectorAll(".chip"),function(b){b.onclick=function(){state.f[b.dataset.f]=b.dataset.v;rerenderList()}});
    Array.prototype.forEach.call(app.querySelectorAll("[data-clear]"),function(b){b.onclick=function(){state.f={dur:"Any",diff:"Any"};rerenderList()}});
    var bk=document.getElementById("bk");if(bk)bk.onclick=function(){state.sel=null;render()};
  }
  nav.addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;state.tab=b.dataset.tab;state.sel=null;render();
  });

  render();
})();

</script>
</body>
</html>
