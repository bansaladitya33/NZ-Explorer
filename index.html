<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:0;
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#1F1410; --muted:#5B4A43; --line:#DCCBC3;
  --accent:#93442F; --accent-ink:#FFFFFF; --soft:#F8EFEA; --deep:#3A1C14; --deepink:#FFFFFF;
  --head:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#140C0A; --surface:#1E1411; --ink:#FFFFFF; --muted:#C4B0A8; --line:#4A352D;
    --accent:#E2937E; --accent-ink:#1A0E0A; --soft:#2A1C17; --deep:#2B1A15; --deepink:#FFFFFF;
  }
}
:root[data-theme="dark"]{
  --bg:#140C0A; --surface:#1E1411; --ink:#FFFFFF; --muted:#C4B0A8; --line:#4A352D;
  --accent:#E2937E; --accent-ink:#1A0E0A; --soft:#2A1C17; --deep:#2B1A15; --deepink:#FFFFFF;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--head);line-height:1.12;margin:0;letter-spacing:-0.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.shell{width:100%;max-width:560px;margin:0 auto;flex:1;padding:0 20px 28px;position:relative}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;margin-top:12px;border-radius:14px;background:linear-gradient(180deg,#8A3F2C,#A9532F);color:#fff;font-family:var(--head);font-weight:700;font-size:18px}
.topbar .linkbtn{color:#fff}.topbar small{color:#fff}.topbar img.mini{filter:invert(1)}
.topbar>span{display:flex;align-items:center}
.topbar small{font-family:var(--body);font-weight:500;font-size:13px}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:13px 20px;font-weight:600;font-size:16px}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* sign in */
.gate{padding-top:56px}
.gate h1{font-size:40px;margin-bottom:12px}
.gate .lede{color:var(--muted);margin-bottom:28px;max-width:44ch}
label{display:block;font-weight:600;margin-bottom:6px}
input[type=text],input[type=email]{width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
input:focus{border-color:var(--accent);outline:none}
.err{font-weight:600;margin-top:12px;border-left:4px solid var(--ink);padding-left:10px}
.demo{margin-top:16px;padding:12px 14px;border:2px solid var(--ink);border-radius:10px;color:var(--muted);font-size:15px}
.demo b{color:var(--ink);font-size:18px;letter-spacing:.12em}
.mark{display:block;width:140px;max-width:50%;height:auto;margin-bottom:28px}
.mini{width:34px;height:34px;vertical-align:middle;margin-right:10px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mark,:root:not([data-theme="light"]) .mini{filter:invert(1)}}
:root[data-theme="dark"] .mark,:root[data-theme="dark"] .mini{filter:invert(1)}
.fine{font-size:13px;color:var(--muted);margin-top:28px;max-width:46ch}

/* home */
.hero{position:relative;padding:36px 0 28px;overflow:hidden}
.hero svg{position:absolute;right:-90px;top:-10px;width:420px;height:420px;z-index:0;pointer-events:none}

.hero>*:not(svg){position:relative;z-index:1}
.hero h1{font-size:44px;max-width:11ch;margin-bottom:16px}
.hero p{color:var(--muted);max-width:42ch;margin-bottom:24px}
.points{border-top:2px solid var(--ink);margin-top:8px}
.points div{padding:18px 0;border-bottom:1px solid var(--line)}
.points h3{font-size:20px;margin-bottom:4px}
.points p{color:var(--muted)}
.note{margin-top:22px;padding:16px 18px;background:var(--soft);border-radius:10px;font-size:14px}

/* list */
.pagehead{padding:28px 0 12px}
.pagehead h1{font-size:34px;margin-bottom:6px}
.pagehead p{color:var(--muted)}
.row{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left-width:6px;border-radius:6px;padding:16px 16px 14px;margin-top:12px}
.row{border-left-color:var(--ink)}
.row h3{font-size:20px;margin-bottom:6px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--muted);font-size:14px}
.bars{display:inline-flex;gap:3px;vertical-align:middle;margin-right:6px}
.bars i{width:6px;height:14px;border-radius:2px;background:var(--line)}
.bars i.on{background:var(--ink)}
.tag{background:var(--soft);border-radius:999px;padding:2px 10px;font-size:13px;color:var(--ink)}
.preview{margin-top:20px;padding:14px 16px;border:2px dashed var(--line);border-radius:10px;font-size:14px;color:var(--muted)}
.preview .btn{margin-top:10px;padding:9px 14px;font-size:14px}

/* detail */
.back{margin-top:18px}
.detail h1{font-size:32px;margin:14px 0 10px}
.detail .desc{font-size:18px;margin-bottom:16px}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;padding:14px 0;border-top:2px solid var(--ink);border-bottom:1px solid var(--line);margin-bottom:8px}
.section{padding:16px 0;border-bottom:1px solid var(--line)}
.section h2{font-size:20px;margin-bottom:8px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:15px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.missing{color:var(--muted);font-style:italic}

/* guide */
.guide h2{font-size:24px;margin:28px 0 10px}
.guide ul,.guide ol{padding-left:20px;margin:8px 0}
.guide li{margin:6px 0}
.status{width:100%;border-collapse:collapse;font-size:15px;margin-top:6px}
.status td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.status td:last-child{text-align:right;font-weight:600;white-space:nowrap;padding-left:12px}
.ok{color:var(--ink)}.warn{color:var(--muted)}.stop{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.callout{padding:14px 16px;background:var(--soft);border-radius:10px;margin:12px 0;font-size:15px}


/* tap targets and new components */
.linkbtn{min-height:44px;padding:10px 0}
.btn{min-height:48px;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.hero{padding:0;margin:14px 0 16px;border-radius:16px;min-height:290px;display:flex;align-items:flex-start;background:linear-gradient(180deg,#8A3F2C 0%,#B5603F 55%,#D98B54 100%)}
.hero svg{position:absolute;inset:0;width:100%;height:100%;right:auto;top:auto}

.hero h1{font-size:31px;max-width:13ch;margin:0;padding:24px 22px;color:#fff;text-shadow:0 1px 8px rgba(40,15,8,.35)}
.how{border:2px solid var(--ink);border-radius:10px;padding:18px;margin:6px 0 18px;background:var(--surface)}
.how h2{font-size:22px;margin-bottom:8px}
.how p+p{margin-top:10px}
.soon{color:var(--muted);font-size:15px}
.stack{display:flex;flex-direction:column;gap:12px}
.stack .btn{width:100%}
.ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.filters{margin-top:6px}
fieldset{border:0;margin:14px 0 0;padding:0;min-width:0}
legend{font-weight:600;margin-bottom:8px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border:2px solid var(--ink);border-radius:999px;background:var(--surface);color:var(--ink);font-weight:500}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.gchip{min-height:44px;padding:0 16px;border:2px solid var(--ink);border-radius:999px;background:var(--surface);color:var(--ink);font-weight:500}
.gchip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.fbar{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.count{color:var(--muted);font-size:15px}
.empty{margin-top:14px;padding:20px;border:2px dashed var(--ink);border-radius:10px;text-align:center}
.srcs{margin:8px 0;padding-left:20px}
.srcs a{color:var(--ink);text-underline-offset:3px;overflow-wrap:anywhere}
.muted{color:var(--muted);font-size:14px}
details{margin-top:12px;border-top:1px solid var(--line);padding-top:4px}
summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:600}
details p{margin-top:8px}
.detail dd{overflow-wrap:anywhere}
.safety h2{font-size:22px;margin:26px 0 8px}
.safety ul{padding-left:20px;margin:8px 0}
.safety li{margin:7px 0}
.banner{background:var(--ink);color:var(--bg);border-radius:10px;padding:18px;margin-top:16px}
.banner .callbtn{display:flex;align-items:center;justify-content:center;min-height:48px;margin-top:14px;background:var(--bg);color:var(--ink);border-radius:10px;font-weight:700;text-decoration:none}
.intro{margin-top:16px}
.links{display:flex;flex-direction:column;gap:10px}
.lnk{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:56px;padding:10px 14px;border:2px solid var(--ink);border-radius:10px;color:var(--ink);text-decoration:none;background:var(--surface)}
.lnk small{display:block;color:var(--muted);font-size:13px}
.disclaimer{border:2px solid var(--ink);border-radius:10px;padding:16px;font-size:15px}
.guide ol li,.guide ul li{overflow-wrap:anywhere}
.field{margin-top:16px}
input[type=password]{width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
input[type=password]:focus{border-color:var(--accent);outline:none}
.note2{margin-top:12px;border-left:4px solid var(--ink);padding-left:10px}


.mapframe{display:block;width:100%;height:180px;border:1px solid var(--line);border-radius:10px;margin:4px 0 12px}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.btnrow .btn{flex:1 1 150px}
.alertbox{border:2px solid var(--ink);border-radius:10px;padding:12px 14px;margin:6px 0 4px;background:var(--soft);font-size:15px}
.check{padding-left:20px;margin:6px 0 12px}
.check li{margin:5px 0}
.eat{padding:10px 0;border-top:1px solid var(--line)}
.pbar{height:8px;border-radius:99px;background:var(--line);margin:8px 0;overflow:hidden}.pbar i{display:block;height:100%;background:var(--ink)}
.share{display:flex;gap:8px;align-items:flex-start;margin:8px 0;font-size:14px}.share input{margin-top:3px;width:20px;height:20px;flex:none}.trip .btn{margin-top:6px;width:100%}.who{margin:8px 0;padding:10px;background:var(--soft);border-radius:10px}
.eat p{margin:2px 0}


/* hero block like the theme mockup */
.hero2{position:relative;overflow:hidden;margin:12px 0 18px;border-radius:20px;color:#fff;background:linear-gradient(180deg,#8A3F2C 0%,#B5603F 55%,#D98B54 100%)}
.hero2 svg.scene{position:absolute;left:0;right:0;bottom:0;width:100%;height:62%;z-index:0;pointer-events:none}
.hero2>*:not(svg){position:relative;z-index:1}
.hbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;background:rgba(58,28,20,.28);font-family:var(--head);font-weight:700;font-size:18px}
.hbar>span{display:flex;align-items:center;gap:10px;white-space:nowrap}
.hbar img{width:28px;height:28px;filter:invert(1)}
.hbar small{font-family:var(--body);font-weight:500;font-size:13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.hbar .linkbtn{color:#fff;min-height:36px;padding:6px 0}
.hcopy{padding:26px 20px 30px}
.hcopy h1{font-size:40px;max-width:10ch;color:#fff;text-shadow:0 1px 10px rgba(40,15,8,.3)}
.hcopy p{margin-top:10px;max-width:30ch;color:#fff;font-size:17px;text-shadow:0 1px 6px rgba(40,15,8,.3)}
.hcopy .btn{margin-top:22px;background:var(--deep);box-shadow:0 0 0 1px rgba(255,255,255,.25);color:#fff;border-radius:12px}
.hero2.tall .hcopy{padding-bottom:180px}
.hero2.short .hcopy{padding-bottom:120px}
.hero2.tall svg.scene{height:48%}
.hero2.short svg.scene{height:44%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.card label{display:block;margin-top:14px;font-weight:600}
.card .lede{margin-bottom:6px}
.fcard{display:block;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:10px}
.fmain{display:block;width:100%;text-align:left;background:none;border:0;padding:0}
.fmain h3{font-size:19px;color:var(--accent);margin-bottom:4px}
.fmain .meta{color:var(--muted);font-size:15px}
.fsafe{color:#B42318;font-weight:700;text-decoration:none;display:inline-block;padding:6px 0 0;min-height:0}
h2.sec{font-size:22px;margin:22px 0 4px}

/* full page scene behind the sign in and home pages */
.scenebg{display:none;position:fixed;top:0;bottom:0;left:50%;width:min(100%,560px);transform:translateX(-50%);z-index:0;pointer-events:none}
.scenebg svg{display:block;width:100%;height:100%}
.scenebg svg.wide{display:none}
body.scene{background:#2B130D}
body.scene .scenebg{display:block}
body.scene .waves{display:none}
body.scene .shell{position:relative;z-index:1}
body.scene .hero2{background:none;overflow:visible;border-radius:0;margin-top:8px}
body.scene .hbar{background:rgba(40,16,10,.45);border-radius:14px}
body.scene .hcopy{padding:30px 6px 0}
body.scene .hero2.short .hcopy{padding-bottom:230px}
body.scene .hero2.tall .hcopy{padding-bottom:210px}
body.scene .fine,body.scene h2.sec{color:#FBEBDD;text-shadow:0 1px 6px rgba(30,10,5,.5)}
body.scene .card,body.scene .how,body.scene .fcard{box-shadow:0 6px 24px rgba(20,8,4,.35)}
/* waves rising from the bottom */
.waves{position:relative;margin-top:auto}
.waves svg{display:block;width:100%;height:150px}
.waves .back{fill:var(--line)}
.waves .front{fill:var(--deep)}
.waves .base{background:var(--deep);height:env(safe-area-inset-bottom,0px)}
.waves.withnav .base{height:calc(62px + env(safe-area-inset-bottom,0px))}
/* nav */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);background:var(--deep);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;border:0;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:500;color:var(--deepink);opacity:.7}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current=page]{opacity:1;font-weight:600}
nav{border-top:0}
.hidden{display:none}
@media (prefers-reduced-motion:no-preference){.view{animation:in .18s ease-out}@keyframes in{from{opacity:0}to{opacity:1}}}

.gal{position:relative;margin:12px 0 4px}
.gal .gt{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;border-radius:14px;scrollbar-width:none}
.gal .gt::-webkit-scrollbar{display:none}
.gal .gt img{flex:0 0 100%;width:100%;height:auto;max-height:340px;object-fit:cover;scroll-snap-align:center;background:#eadfd8}
.gal .ga{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:0;background:rgba(58,28,20,.65);color:#fff;font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.gal .ga:hover{background:rgba(58,28,20,.9)}.gal .gp{left:8px}.gal .gn{right:8px}
.gal .gc{position:absolute;right:10px;bottom:10px;background:rgba(58,28,20,.7);color:#fff;font-size:13px;padding:3px 9px;border-radius:12px}

/* laptop and desktop widths */
.agrid{display:block}
@media (min-width:900px){
.shell{max-width:1080px;padding:0 32px 96px}
.scenebg{width:100%}
.scenebg svg.narrow{display:none}
.scenebg svg.wide{display:block}
nav{left:0;transform:none;width:100%;justify-content:center;gap:56px}
nav button{flex:0 0 150px}
.hero2 .hcopy h1{font-size:54px;max-width:14ch}
.hero2 .hcopy p{font-size:20px}
.hero2.tall .hcopy{padding-bottom:230px}
.hero2.short ~ .card,.hero2.short ~ .fine{max-width:520px;margin-left:auto;margin-right:auto}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:12px}
.agrid .row,.agrid .fcard{margin-top:0}
.agrid .fcard{height:100%}
.view.detail,.view.safety{max-width:860px;margin-left:auto;margin-right:auto}
.gal .gt img{max-height:460px}
.pagehead h1{font-size:40px}
}
@media (min-width:1300px){.shell{max-width:1200px}}

.wxbox{margin:12px 0 4px;padding:12px 14px;border-radius:12px;background:var(--soft);border:1px solid var(--line)}
.wxnow{font-size:15px;margin-bottom:8px}.wxnow b{font-size:20px}
.wxdays{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wxday{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;line-height:1.4}
.wxday b{display:block}.wxwarn{margin-top:8px;font-weight:600;color:var(--accent)}

/* user chosen looks */

.plan ul,.plfree ul{list-style:none;padding-left:0}.plan li,.plfree li{padding-left:22px;position:relative;margin:4px 0;break-inside:avoid;font-size:14px}.plan li::before,.plfree li::before{content:"✓";position:absolute;left:2px;color:var(--accent);font-weight:800}
.plcq{display:grid;grid-template-columns:1fr;gap:18px;margin-top:18px}
.tblw{overflow-x:auto}.cmp{width:100%;border-collapse:collapse;font-size:14px}.cmp th,.cmp td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:center}.cmp th:first-child,.cmp td:first-child{text-align:left}.cmp td b{color:var(--accent)}.cmp .yes{color:var(--accent);font-weight:800}
.faq{border-bottom:1px solid var(--line);padding:10px 0}.faq summary{font-weight:600;cursor:pointer}.faq p{margin-top:6px;color:var(--muted);font-size:14px}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:14px 18px 22px;max-height:90vh;overflow:auto}
.sheet .grab{display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sum{width:100%;border-collapse:collapse;margin:10px 0;font-size:14px;border:1px solid var(--line);border-radius:10px}.sum td{padding:9px 12px;border-bottom:1px solid var(--line)}.sum td:last-child{text-align:right}
@media (min-width:760px){.plgrid{grid-template-columns:repeat(3,1fr)}.plfree ul{columns:4}.plcq{grid-template-columns:1.2fr 1fr}.sheetbg{align-items:center}.sheet{border-radius:18px}}
@media (min-width:900px){.view.plans{max-width:1000px;margin:0 auto}.plhead{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:end}}

.passbox{border:2px solid var(--accent);border-radius:12px;padding:12px 14px;margin-top:10px;background:var(--surface)}
.passbox .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.passbox .btn{width:auto;flex:1 1 140px}

  var LOC = {"A04": ["Shelley Bay Toilet Reserve, end of Second View Avenue, Beachlands", "142 Second View Avenue, Beachlands, Auckland", "Third View Avenue, Beachlands, Auckland", "Maraetai Park, off Maraetai Drive (one way)", "6 km one way, about 1 h 30. Getting back: bus from Maraetai to Third View Avenue, then a 5 minute walk. Bus route and times are still being checked."], "A05": ["Te Wero Bridge, Viaduct Basin (99 Customs Street West)", "Te Wero Bridge, Viaduct Harbour, Auckland", "Britomart Station, Auckland CBD", "Taumanu Reserve, Onehunga (Manukau Harbour)", "16 km, about 5 hours end to end. It is a one way walk, so plan your way back from Onehunga. Return transport is still being checked."], "A06": ["Domain Wintergardens, end of Wintergarden Road, Auckland Domain", "Domain Wintergardens, 20 Park Road, Grafton, Auckland", "Domain Wintergardens, 20 Park Road, Grafton, Auckland", "About 2-3 km, 1-2 h (Ref 9 estimate)", "About 2 to 3 km, 1 to 2 hours. A loop that returns to the start. The Wintergardens are free."], "A07": ["Main entrance, 250 Mount Eden Road", "250 Mount Eden Road, Mount Eden, Auckland", "250 Mount Eden Road, Mount Eden, Auckland", "2.1 km circuit, about 40 min-1 h (Ref 9)", "2.1 km circuit, about 40 min to 1 hour. Same way back to the entrance. Some tracks may close for quarry works, so check before you go."], "A08": ["Ferry Building, corner of Queen Street and Quay Street, downtown", "Ferry Building, 99 Quay Street, Auckland CBD", "Britomart Station, Auckland CBD", "9.7 km one way, about 2 h", "9.7 km one way, about 2 hours. You can stop at Mission Bay. Getting back: bus to the city from across St Heliers Bay beach."], "A09": ["Behind Parnell library, Parnell Road", "545 Parnell Road, Parnell, Auckland", "545 Parnell Road, Parnell, Auckland", "About 1 h", "About 1 hour. Saturdays only, 8am to 12pm. Getting back: Inner or Outer Link bus. The street number is from listings, so look for the market behind the library."], "A10": ["Waiwharariki An   var NEWW = {"A06": {"backup": "Auckland Museum, Auckland Domain", "why": "The park paths, courtyard and fernery are outdoors. Heavy rain, strong wind or heat can affect the wider park outing. The two glasshouses provide partial cover, so light rain does not automatically prevent a visit.", "whyBackup": "Indoor galleries in the same Domain area offer a cultural outing without a cross-city journey. Auckland residents can obtain free general admission with address proof. Other admission charges may apply.", "src": [["Original activity page", "https://new.aucklandcouncil.govt.nz/en/parks-recreation/find-park-beach/park-detail/126.html"], ["Backup: Auckland Museum", "https://www.aucklandmuseum.com/visit/plan-your-visit/hours-and-admission"]], "date": "9 Oct 2026", "note": "Check museum opening hours before you go. The Wintergardens close at 4:30pm until 31 October. Admission to the museum may cost extra."}, "A07": {"backup": "Westfield Newmarket, indoor browsing and food court", "why": "This is an outdoor summit route. Council describes some tracks as stony and steep. Rain can reduce grip, and strong winds or poor visibility can make the summit outing less suitable.", "whyBackup": "An indoor Newmarket outing avoids the exposed summit and steep tracks. Browsing does not require a purchase. It is a different type of activity, but provides a practical nearby-area option with later trading hours.", "src": [["Original activity page", "https://new.aucklandcouncil.govt.nz/en/parks-recreation/get-outdoors/aklpaths/path-detail/393.html"], ["Backup: Westfield Newmarket", "https://www.westfield.co.nz/newmarket/opening-hours"]], "date": "9 Oct 2026", "note": "The backup is in Newmarket, away from the summit, so it needs a short trip. Check individual shop hours. Food and transport cost extra."}, "A08": {"backup": "SEA LIFE Kelly Tarlton’s Aquarium, Ōkahu Bay", "why": "The waterfront and beach sections are outdoors and exposed. Heavy rain, strong coastal winds and heat can affect walking comfort. Optional swimming requires its own conditions check.", "whyBackup": "The aquarium is an all-weather indoor attraction on Tāmaki Drive. It keeps a coastal/marine theme while avoiding a long exposed waterfront walk. Admission is paid and requires a budget decision.", "src": [["Original activity page", "https://new.aucklandcouncil.govt.nz/en/parks-recreation/get-outdoors/aklpaths/path-detail/246.html"], ["Backup: SEA LIFE Kelly Tarlton’s Aquarium", "https://www.visitsealife.com/auckland/plan-your-day/before-you-visit/opening-hours/"]], "date": "9 Oct 2026", "note": "Aquarium hours are 9:30am to 5pm with last entry at 4pm. Tickets are paid. Check tickets, time slots and transport alerts first."}, "A09": {"backup": "Auckland Museum, Auckland Domain", "why": "The market is an outdoor car-park outing. Its organiser says it trades in rain or sunshine, so ordinary rain is not an automatic cancellation. Heavy rain or strong wind can still affect visitor comfort and access.", "whyBackup": "Indoor galleries offer a cultural visit in the adjoining Domain area rather than an exposed market stroll. Auckland residents should bring address proof for free general admission. Other admission charges may apply.", "src": [["Original activity page", "https://villagesquare.org.nz/parnell-farmers-market"], ["Backup: Auckland Museum", "https://www.aucklandmuseum.com/visit/plan-your-visit/hours-and-admission"]], "date": "9 Oct 2026", "note": "Check the museum opening time before you go. Walking from the market to the Domain is still outdoors."}, "A10": {"backup": "Shore City Shopping Centre, Takapuna", "why": "The beach and market stroll are mainly outdoors. Strong wind, heavy rain or heat can reduce suitability. A weather-dependent flag does not mean the Sunday market necessarily closes in light rain.", "whyBackup": "Indoor browsing and a food-court break provide a town-centre alternative without travelling back across the harbour. The venue is in the same Takapuna area, but does not replace the beach experience.", "src": [["Original activity page", "https://new.aucklandcouncil.govt.nz/en/parks-recreation/find-park-beach/park-detail/450.html"], ["Backup: Shore City Shopping Centre", "https://www.shore-city.co.nz/visit/trading-hours/"]], "date": "9 Oct 2026", "note": "Shopping centre Sunday opening hours are unclear between sources (9am or 10am). Confirm before relying on it. Purchases are optional."}, "A11": {"backup": "Catalina Bay Farmers Market, covered weekend market", "why": "The coastal loop includes waterfront boardwalks and exposed walking sections. Rain, wind and heat can affect the outing. A covered venue does not resolve weather-related ferry disruption.", "whyBackup": "The official Hobsonville Point page describes the market as fully covered and beside the ferry landing. Browsing produce and food offers a sheltered local alternative without adding another district to the trip.", "src": [["Original activity page", "https://new.aucklandcouncil.govt.nz/en/parks-recreation/get-outdoors/aklpaths/path-detail/72.html"], ["Backup: Catalina Bay Farmers Market", "https://hobsonvillepoint.co.nz/visit/farmers-market/"]], "date": "9 Oct 2026", "note": "The market runs Saturday and Sunday 8:30am to 2pm. It is covered but not windproof. Check ferry alerts, and postpone if travel is unsafe."}, "A12": {"backup": "Māngere Bridge Library, indoor reading and browsing", "why": "Farm paths, harbour views and animal viewing are outdoors. Heavy rain can reduce comfort on grassy paths, while wind and heat affect the open farm/harbour setting.", "whyBackup": "The library offers an indoor, low-cost reading break in Māngere Bridge village. It avoids an exposed farm walk, but is a separate village destination rather than an on-site farm attraction.", "src": [["Original activity page", "https://new.aucklandcouncil.govt.nz/en/parks-recreation/find-park-beach/park-detail/202.html"], ["Backup: Māngere Bridge Library", "https://new.aucklandlibraries.govt.nz/en/locations-and-services.html"]], "date": "9 Oct 2026", "note": "The library is open Saturday 10am to 4pm at 5 to 7 Church Road. It is a separate village stop, so confirm the route first."}, "A13": {"backup": "Huakaiwaka Visitor Centre, Auckland Botanic Gardens", "why": "The garden paths and plant collections are mainly outdoors. Heavy rain, strong wind or heat can affect a 2–3 hour garden stroll. The visitor centre offers partial cover but does not shelter the whole route.", "whyBackup": "The covered visitor-centre atrium and its architecture provide a shorter on-site alternative at the Hill Road entrance. Users can remain at the same destination without taking the full outdoor garden walk.", "src": [["Original activity page", "https://www.aucklandbotanicgardens.co.nz/visit-us/"], ["Backup: Huakaiwaka Visitor Centre", "https://www.aucklandbotanicgardens.co.nz/visit-us/visitor-centre/"]], "date": "9 Oct 2026", "note": "The visitor centre is open daily 8am to 4:30pm. It is a short covered break, not a full alternative."}, "A14": {"backup": "Westfield St Lukes, indoor browsing and food court", "why": "The lakeside paths, lawns and bird-viewing areas are outdoors. Rain, wind or heat can affect the short park walk. Tree shade is not a reliable wet-weather shelter.", "whyBackup": "An indoor shopping-centre visit offers a covered alternative in the wider Western Springs/Mount Albert area. It is practical for the late-afternoon trip, but changes the activity from nature to browsing and food.", "src": [["Original activity page", "https://new.aucklandcouncil.govt.nz/en/parks-recreation/find-park-beach/park-detail/146.html"], ["Backup: Westfield St Lukes", "https://www.westfield.co.nz/stlukes/opening-hours"]], "date": "9 Oct 2026", "note": "This backup is off site at 80 St Lukes Road, so you need a new meeting point and a bus or walk there."}, "A15": {"backup": "Ōtara Library, indoor reading and browsing", "why": "The market browsing area is outdoors. Rain and wind can affect the experience even if trading continues. Do not infer cancellation from the weather flag; check the organiser’s current notice.", "whyBackup": "The library is in Ōtara town centre, allowing an indoor reading break close to the market rather than a cross-city transfer. It is a quieter alternative, not an indoor replacement for the market stalls.", "src": [["Original activity page", "https://www.otaramarkets.co.nz/"], ["Backup: Ōtara Library", "https://new.aucklandlibraries.govt.nz/en/locations-and-services.html"]], "date": "9 Oct 2026", "note": "The library is open Saturday 8am to 1:30pm at 46 Fair Mall in Ōtara town centre."}};
  var NEWS = {"A06": ["Low", "An easy walk on park paths. Some paths are sloped and can be slippery after rain, so wear shoes with grip. The Wintergardens close at 4:30pm (Apr to Oct) or 5pm (Nov to Mar). Plan to finish in daylight and keep to the main lit paths if you stay later.", "Close to campus and bus routes. Walk with others if leaving after dark."], "A07": ["Low to Moderate", "Some tracks are steep and stony. Wear proper shoes and take care coming down, especially when wet. Stay on the formed paths. The crater is tapu (sacred) to Māori, so do not enter it or walk down into it. The summit is exposed, so bring water, a hat and a layer for wind.", "Short walk from the train or bus. Allow extra time to walk back down, and do not rush the descent to catch a connection."], "A08": ["Low to Moderate", "The waterfront path is shared with bikes and scooters, so keep left, look before stepping out, and cross Tāmaki Drive only at crossings. There is little shade, so be SunSmart. If you swim at Mission Bay, check Safeswim first. Lifeguard patrols usually run Nov to Mar only, so in spring swim close to shore with a buddy.", "Buses run along the waterfront, so you can stop when tired and bus back rather than over walking 9.7 km."], "A09": ["Low", "A relaxed market. Bring some cash, as not all stalls take cards, and keep your wallet and phone in a front pocket or zipped bag in crowds. If you have a food allergy, ask stallholders about ingredients before buying.", "Easy to combine with the Domain on foot. Walk together and agree a meeting point if the group splits up."], "A10": ["Low to Moderate", "Check Safeswim before swimming. Takapuna's water quality and conditions are updated every 15 minutes. Lifeguards patrol only in summer (about Nov to Mar), so swim between the red and yellow flags when they are up, and stay near shore with a buddy otherwise. Be SunSmart on the beach and keep valuables close at the market.", "Know your bus or ferry back before you settle in at the beach. Sunday services can be less frequent."], "A11": ["Low", "A flat coastal walk with boardwalks and railings. Boardwalks can be slippery when wet, so take care and keep to the path along the coastal edges. Check the return ferry time before you start. On Saturdays some midday sailings are about 2 hours apart.", "Note the next ferry back as soon as you arrive. If you miss it, take bus 112 or 114 to Westgate, then the Western Express."], "A12": ["Low to Moderate", "Use the grassy lanes between enclosures to see the animals. Do not enter paddocks during lambing (mid July to early August), and give mothers with young plenty of space. Do not feed the animals, and wash or sanitise your hands afterwards. Stay on the paths. The coast is a shorebird habitat, and the mudflats are not safe to walk on.", "The walk from the bus stop is about 15 min along Ambury Rd. Check your bus back before heading out on the longer loop."], "A13": ["Low", "A safe, well kept garden with a visitor centre. Stay on the paths and be SunSmart on open lawns. Cycling is not allowed inside the Gardens. The visitor centre (8am to 4:30pm) is the place to ask for help.", "Bus 366 runs about every 30 min. If you miss it, the walk back to Manurewa station is 20 min. Do it in daylight and in a group."], "A14": ["Low", "An easy 1.75 km loop around the lake. Do not feed the ducks, geese or pūkeko, as it makes them aggressive and spreads disease. The lake is not a swimming spot, so keep back from the edges, especially with children around. Toilets and drinking fountains are in the park.", "Frequent buses on Great North Road, so it is easy to leave at any time."], "A15": ["Low to Moderate", "A busy, friendly market. Bring cash in small notes and keep it, your phone and cards in a front or zipped pocket. Agree a meeting point in case your group gets separated. Bring water and a hat on warm mornings. It opens at 6am and finishes at 12pm.", "Travel in daylight with your group. The market finishes at midday, so plan your way back before stalls pack up."]};

      var h='<h2>Reviews</h2>';

      var avg=list.reduce(function(s,x){return s+(x.stars||0)},0)/list.length;
      h+='<p class="rv-avg"><span class="rv-stars">'+stars(avg)+'</span> '+avg.toFixed(1)+' from '+list.length+' review'+(list.length>1?'s':'')+'</p>';
      list.slice(0,10).forEach(function(x,k){h+='<div class="rv"><p><span class="rv-stars">'+stars(x.stars)+'</span> <b>'+esc(x.name||"Student")+'</b> <span class="muted">'+esc(new Date(x.at||0).toLocaleDateString("en-NZ",{day:"numeric",month:"short"}))+'</span>'+(x.demo?' <span class="tag">Example review</span>':'')+'</p>'+(x.text?'<p>'+esc(x.text)+'</p>':'');
        if(x.uid!==state.uid)h+='<button type="button" class="rep" data-rr="'+k+'">Report</button>';
        h+='</div>'});
      box.innerHTML=h;
      Array.prototype.forEach.call(box.querySelectorAll("[data-rr]"),function(b){var x=list[+b.dataset.rr];b.onclick=function(){report({type:"review",tripId:x.tripId||"",itemId:x.id,text:String(x.text||"").slice(0,300),author:x.name||"Student"},b)}});
    }).catch(function(){box.innerHTML='<h2>Reviews</h2><p class="muted">Reviews could not load right now.</p>'});
  }
  function report(o,btn){if(!db||!state.uid)return;btn.disabled=true;o.by=state.uid;o.at=Date.now();
    db.collection("reports").add(o).then(function(){btn.textContent="Reported. Thanks, the team will check it."}).catch(function(){btn.disabled=false;btn.textContent="Could not report. Try again"})}
  var OWNER="aban600@aucklanduni.ac.nz";
  function isOwnerUser(){return (state.user||"").toLowerCase()===OWNER}
  var APPROVED={};
  function loadApprovedPhotos(a){
    var gt=document.getElementById("gt");if(!db||!gt)return;
    db.collection("photoSubs").where("activityId","==",a.id).where("status","==","approved").get().then(function(r){
      if(state.sel===null||A[state.sel]!==a)return;var g=document.getElementById("gt");if(!g)return;
      r.forEach(function(d){var p=d.data();if(!/^data:image\/(jpeg|png);base64,/.test(p.data||""))return;var im=document.createElement("img");im.src=p.data;im.alt="Photo from "+(p.name||"a student");im.loading="lazy";g.appendChild(im)});
      var n=g.children.length,gc=document.getElementById("gc");
      if(n>1&&!document.getElementById("gp")){var wrap=g.parentNode;wrap.insertAdjacentHTML("beforeend",'<button class="ga gp" id="gp" aria-label="Previous photo">&#8249;</button><button class="ga gn" id="gnx" aria-label="Next photo">&#8250;</button><span class="gc" id="gc">1 / '+n+'</span>');bindGallery()}
      else if(gc)gc.textContent=(Math.round(g.scrollLeft/g.clientWidth)+1)+" / "+n;
    }).catch(function(){});
  }
  function approvalsView(){
    var h='<div class="view">'+topbar()+'<div class="pagehead"><h1>Team page</h1><p>Only the NZ Explorer team can see this page.</p></div>';
    if(!isOwnerUser())return h+'<p class="muted">Only the NZ Explorer team can see this page.</p></div>';
    h+='<h2>Reported messages and reviews</h2><div id="repq"><p class="muted">Loading reports...</p></div>';
    h+='<h2 style="margin-top:22px">Photo approvals</h2><p class="muted">Photos students sent with their reviews. Approved photos join that activity\'s gallery.</p><div id="apq"><p class="muted">Loading photos...</p></div>';
    h+='<h2 style="margin-top:22px">Plan interest (Ref 46)</h2><div id="plcount"><p class="muted">Loading...</p></div>';
    h+='<h2 style="margin-top:22px">Demo data</h2><p class="muted">Creates trips in the next 3 days that are almost full, one past trip and 3 example reviews (marked "Example review"), so every feature has something to show in a demo. Remove it all afterwards with one tap.</p><div class="btnrow"><button class="btn" id="demoadd">Create demo data</button><button class="btn ghost" id="demodel">Remove demo data</button></div><p class="muted" id="demomsg" role="status"></p>';
    return h+'</div>';
  }
  function bindReports(){
    var box=document.getElementById("repq");if(!box||!db)return;
    db.collection("reports").get().then(function(r){
      var list=[];r.forEach(function(d){var x=d.data();x.id=d.id;list.push(x)});list.sort(function(p,q){return (p.at||0)-(q.at||0)});
      if(!list.length){box.innerHTML='<p class="muted">No reports. Anything students report will appear here.</p>';return}
      var h='';list.forEach(function(x,k){h+='<div class="apr"><div><b>'+(x.type==="review"?"Review":"Chat message")+' by '+esc(x.author||"Student")+'</b><p>'+esc(x.text||"")+'</p><p class="muted">Reported '+esc(new Date(x.at||0).toLocaleDateString("en-NZ",{day:"numeric",month:"short"}))+'</p><div class="btnrow"><button class="btn" data-hide="'+k+'">Hide it</button><button class="btn ghost" data-keep="'+k+'">Keep it</button></div></div></div>'});
      box.innerHTML=h;
      function done(b,t){var c=b.closest(".apr");c.innerHTML='<p class="muted">'+t+'</p>'}
      Array.prototype.forEach.call(box.querySelectorAll("[data-hide]"),function(b){b.onclick=function(){var x=list[+b.dataset.hide];b.disabled=true;
        var ref=x.type==="review"?db.collection("reviews").doc(x.itemId):db.collection("trips").doc(x.tripId).collection("messages").doc(x.itemId);
        ref.delete().then(function(){return db.collection("reports").doc(x.id).delete()}).then(function(){RV.agg=null;done(b,"Hidden. Students can no longer see it.")}).catch(function(){b.disabled=false})}});
      Array.prototype.forEach.call(box.querySelectorAll("[data-keep]"),function(b){b.onclick=function(){var x=list[+b.dataset.keep];b.disabled=true;db.collection("reports").doc(x.id).delete().then(function(){done(b,"Kept. The report was cleared.")}).catch(function(){b.disabled=false})}});
    }).catch(function(){box.innerHTML='<p class="muted">Could not load reports. Check the new Firestore rules are published.</p>'});
  }
  function bindDemo(){
    var add=document.getElementById("demoadd"),del=document.getElementById("demodel"),msg=document.getElementById("demomsg");if(!add||!db)return;
    function day(n){var d=new Date(todayISO()+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
    add.onclick=function(){add.disabled=true;msg.textContent="Creating...";var b=db.batch(),T=db.collection("trips");
      [["A02",1,"10:00","Cornwall Park, Greenlane Road entrance",6,5],["A07",2,"16:00","Mt Eden Road summit track entrance",8,6],["A05",3,"09:30","Te Wero Bridge, Wynyard Quarter",8,7]].forEach(function(t,k){
        b.set(T.doc("demo_up"+k),{activityId:t[0],date:day(t[1]),time:t[2],meeting:t[3],max:t[4],joined:t[5],womenOnly:false,demo:true})});
      b.set(T.doc("demo_past"),{activityId:"A01",date:day(-4),time:"09:00",meeting:"Downtown Ferry Terminal, Pier 4",max:8,joined:3,womenOnly:false,demo:true});
      [["A01","Example student A",5,"Amazing views from the summit. Bring more water than you think, there is none on the island."],["A01","Example student B",4,"Lava rock is rough on the feet, wear proper shoes. The ferry back fills up, get there early."],["A07","Example student C",5,"Short walk with the best city view. Great for a first trip with new people."]].forEach(function(r,k){
        b.set(db.collection("reviews").doc("demo_rv"+k),{uid:"demo",name:r[1],activityId:r[0],tripId:"demo_past",stars:r[2],text:r[3],sent:0,at:Date.now()-k*3600000,demo:true})});
      b.commit().then(function(){RV.agg=null;msg.textContent="Demo data created. Check the home page and the activity list.";add.disabled=false}).catch(function(){add.disabled=false;msg.textContent="Could not create it. Check the new Firestore rules are published."})};
    del.onclick=function(){del.disabled=true;msg.textContent="Removing...";
      Promise.all([db.collection("trips").where("womenOnly","==",false).where("demo","==",true).get(),db.collection("reviews").where("demo","==",true).get()]).then(function(res){var b=db.batch(),cols=["trips","reviews"];res.forEach(function(r,i){r.forEach(function(d){b.delete(db.collection(cols[i]).doc(d.id))})});return b.commit()})
      .then(function(){RV.agg=null;msg.textContent="Demo data removed.";del.disabled=false}).catch(function(){del.disabled=false;msg.textContent="Could not remove it right now."})};
  }
  function bindPlanCount(){var box=document.getElementById("plcount");if(!box||!db)return;
    db.collection("planInterest").get().then(function(r){var c={trip:0,month:0,sem:0},o=0,n=0;r.forEach(function(d){var x=d.data();if(c[x.plan]!==undefined)c[x.plan]++;if(x.optIn)o++;n++});
      box.innerHTML=n?'<p>'+PLANS.map(function(p){return esc(p.name)+': <b>'+c[p.id]+'</b>'}).join(' · ')+'</p><p class="muted">'+n+' student'+(n>1?'s':'')+' registered interest, '+o+' want an email when passes go live.</p>':'<p class="muted">No one has registered interest yet.</p>'}).catch(function(){box.innerHTML='<p class="muted">Could not load. Check the new Firestore rules are published.</p>'})}
  function bindApprovals(){
    bindReports();bindDemo();bindPlanCount();
    var box=document.getElementById("apq");if(!box||!db)return;
    db.collection("photoSubs").where("status","==","pending").get().then(function(r){
      var list=[];r.forEach(function(d){var p=d.data();p.id=d.id;list.push(p)});list.sort(function(p,q){return (p.at||0)-(q.at||0)});
      if(!list.length){box.innerHTML='<p class="muted">Nothing waiting. New photos will appear here.</p>';return}
      var h='';list.forEach(function(p){var a=A[actIndex(p.activityId)]||{name:p.activityId};
        h+='<div class="apr"><img alt="Photo waiting for approval"><div><b>'+esc(a.name)+'</b><p class="muted">From '+esc(p.name||"Student")+', '+esc(new Date(p.at||0).toLocaleDateString("en-NZ",{day:"numeric",month:"short"}))+'</p><div class="btnrow"><button class="btn" data-ap="'+esc(p.id)+'">Approve</button><button class="btn ghost" data-rj="'+esc(p.id)+'">Reject</button></div></div></div>'});
      box.innerHTML=h;
      Array.prototype.forEach.call(box.querySelectorAll(".apr img"),function(im,k){if(/^data:image\/(jpeg|png);base64,/.test(list[k].data||""))im.src=list[k].data});
      function act(id,st,b){b.disabled=true;db.collection("photoSubs").doc(id).update({status:st}).then(function(){var c=b.closest(".apr");c.innerHTML='<p class="muted">'+(st==="approved"?"Approved. It now shows in the activity gallery.":"Rejected.")+'</p>'}).catch(function(){b.disabled=false})}
      Array.prototype.forEach.call(box.querySelectorAll("[data-ap]"),function(b){b.onclick=function(){act(b.dataset.ap,"approved",b)}});
      Array.prototype.forEach.call(box.querySelectorAll("[data-rj]"),function(b){b.onclick=function(){act(b.dataset.rj,"rejected",b)}});
    }).catch(function(){box.innerHTML='<p class="muted">Could not load photos. Check the Firestore rules are published.</p>'});
  }
  function bindGallery(){var gt=document.getElementById("gt");if(!gt)return;var go=function(d){var n=gt.children.length,w=gt.clientWidth,k=Math.round(gt.scrollLeft/w)+d;if(k<0)k=n-1;if(k>=n)k=0;gt.scrollTo({left:k*w,behavior:"smooth"})};gt.onscroll=function(){var gc=document.getElementById("gc");if(gc)gc.textContent=(Math.round(gt.scrollLeft/gt.clientWidth)+1)+" / "+gt.children.length};var gp=document.getElementById("gp"),gx=document.getElementById("gnx");if(gp)gp.onclick=function(){go(-1)};if(gx)gx.onclick=function(){go(1)}}
  function render(){
    stopChat();
    if(state.user&&location.hash==="#approvals"&&isOwnerUser()&&!state.apSeen){state.apSeen=true;state.tab="approvals";state.sel=null}
    if(state.user&&location.hash==="#plans"&&!state.plSeen){state.plSeen=true;state.tab="plans";state.sel=null}
    if(!state.user){renderGate();return}
    nav.classList.remove("hidden");waves.classList.add("withnav");
    var v=state.tab==="home"?homeView():state.tab==="safety"?safetyView():state.tab==="profile"?profileView():state.tab==="look"?lookView():state.tab==="plans"?plansView():state.tab==="trips"?(state.review?reviewView():tripsView()):state.tab==="chats"?chatsView():state.tab==="approvals"?approvalsView():(state.sel!==null?detailView():listView());
    app.innerHTML=v;
    Array.prototype.forEach.call(nav.querySelectorAll("button"),function(b){
      if(b.dataset.tab===state.tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");
    });
    bind();
    if(state.tab==="activities"&&state.sel!==null){var aa=A[state.sel];loadPass(function(){loadTrips(aa)});loadWeather(aa)}
    if(state.tab==="activities"&&state.sel===null){loadListWeather();loadRatings()}
    if(state.tab==="profile")bindProfile();
    if(state.tab==="look")bindLook();
    if(state.tab==="plans")bindPlans();
    if((state.tab==="trips"||state.tab==="chats")&&MY.list===null&&!MY.loading&&db&&state.uid){MY.loading=true;loadMyTrips(function(){MY.loading=false;if(state.tab==="trips"||state.tab==="chats")render()})}
    if(state.tab==="chats"&&state.chat)bindChat();
    if(state.tab==="trips"&&state.review)bindReview();
    if(state.tab==="trips"&&!state.review&&MY.list){fillMyTripsWx();
      Array.prototype.forEach.call(app.querySelectorAll(".mleave"),function(b){b.onclick=function(){
        var id=b.dataset.id,m=document.getElementById("ml-"+id);
        if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="Tap again to leave";m.textContent="Your place will go to someone else and you will lose access to the group chat.";return}
        b.disabled=true;var batch=db.batch(),tr=db.collection("trips").doc(id);
        batch.delete(tr.collection("members").doc(state.uid));batch.update(tr,{joined:firebase.firestore.FieldValue.increment(-1)});
        batch.commit().then(function(){MY.list=null;state.flash="You have left that trip. Your place is free for someone else.";render()}).catch(function(){b.disabled=false;m.textContent="Could not leave right now. Please try again."})}})}
    if(state.tab==="approvals")bindApprovals();
    if(state.tab==="activities"&&state.sel!==null){loadReviews(A[state.sel]);loadApprovedPhotos(A[state.sel])}
    if(state.tab==="home")loadPass(loadUpcoming);
    window.scrollTo(0,0);
  }
  function refreshWx(){if(state.tab==="activities"){if(state.sel!==null)loadWeather(A[state.sel]);else loadListWeather()}else if(state.tab==="trips"&&MY.list)fillMyTripsWx()}
  setInterval(refreshWx,30*60000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden)refreshWx()});
  function rerenderList(){app.innerHTML=listView();bind();loadListWeather()}
  function bind(){
    Array.prototype.forEach.call(app.querySelectorAll(".mbtn"),function(b){b.onclick=function(e){e.stopPropagation();var l=b.nextElementSibling,open=l.hidden;l.hidden=!open;b.setAttribute("aria-expanded",String(open))}});
    var o=document.getElementById("out");if(o)o.onclick=function(){if(auth)auth.signOut();state.user=null;state.name="";state.mode="signin";state.step="email";state.email="";state.error="";state.profile={name:"",age:"",gender:""};state.gender="";state.uid=null;state.gmsg="";state.sel=null;state.f={dur:"Any",diff:"Any",wx:"Any",zone:"Any",free:false,ready:false,sort:"Suggested"};render()};
    Array.prototype.forEach.call(app.querySelectorAll("[data-go]"),function(b){b.onclick=function(){state.tab=b.dataset.go;state.sel=null;state.chat=null;state.review=null;if(state.tab==="trips"||state.tab==="chats")MY.list=null;render()}});
    Array.prototype.forEach.call(app.querySelectorAll("[data-chat]"),function(b){b.onclick=function(){state.tab="chats";state.chat=b.dataset.chat;state.sel=null;render()}});
    Array.prototype.forEach.call(app.querySelectorAll("[data-review]"),function(b){b.onclick=function(){state.tab="trips";state.review=b.dataset.review;state.rv=null;state.sel=null;render()}});
    Array.prototype.forEach.call(app.querySelectorAll(".row"),function(b){b.onclick=function(){state.sel=+b.dataset.i;render()}});
    Array.prototype.forEach.call(app.querySelectorAll("[data-feat]"),function(b){b.onclick=function(){state.tab="activities";state.sel=+b.dataset.feat;render()}});
    Array.prototype.forEach.call(app.querySelectorAll(".chip[data-f]"),function(b){b.onclick=function(){state.f[b.dataset.f]=b.dataset.v;rerenderList()}});
    var ft=document.getElementById("ftog");if(ft)ft.onclick=function(){state.fopen=!state.fopen;rerenderList()};
    Array.prototype.forEach.call(app.querySelectorAll(".chip[data-tog]"),function(b){b.onclick=function(){state.f[b.dataset.tog]=!state.f[b.dataset.tog];rerenderList()}});
    Array.prototype.forEach.call(app.querySelectorAll("[data-clear]"),function(b){b.onclick=function(){state.f={dur:"Any",diff:"Any",wx:"Any",zone:"Any",free:false,ready:false,sort:"Suggested"};rerenderList()}});
    bindGallery();
    Array.prototype.forEach.call(app.querySelectorAll("[data-jump]"),function(b){b.onclick=function(){var t=document.getElementById(b.dataset.jump);if(t)t.scrollIntoView({behavior:"smooth",block:"start"})}});
    var bk=document.getElementById("bk");if(bk)bk.onclick=function(){state.sel=null;render()};
  }
  document.addEventListener("click",function(e){if(!e.target.closest(".umenu"))Array.prototype.forEach.call(document.querySelectorAll(".mlist"),function(l){l.hidden=true})});
  document.addEventListener("keydown",function(e){if(e.key==="Escape")Array.prototype.forEach.call(document.querySelectorAll(".mlist"),function(l){l.hidden=true})});
  window.addEventListener("hashchange",function(){if(location.hash==="#plans"&&state.user){state.tab="plans";state.sel=null;render();return}if(location.hash==="#approvals"&&state.user&&isOwnerUser()){state.tab="approvals";state.sel=null;render()}});
  nav.addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;state.tab=b.dataset.tab;state.sel=null;state.chat=null;state.review=null;if(state.tab==="trips"||state.tab==="chats")MY.list=null;render();
  });

  render();
})();

</script>
