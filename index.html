<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:0;
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#1F1410; --muted:#5B4A43; --line:#DCCBC3;
  --accent:#93442F; --accent-ink:#FFFFFF; --soft:#F8EFEA; --deep:#3A1C14; --deepink:#FFFFFF;
  --head:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#140C0A; --surface:#1E1411; --ink:#FFFFFF; --muted:#C4B0A8; --line:#4A352D;
    --accent:#E2937E; --accent-ink:#1A0E0A; --soft:#2A1C17; --deep:#2B1A15; --deepink:#FFFFFF;
  }
}
:root[data-theme="dark"]{
  --bg:#140C0A; --surface:#1E1411; --ink:#FFFFFF; --muted:#C4B0A8; --line:#4A352D;
  --accent:#E2937E; --accent-ink:#1A0E0A; --soft:#2A1C17; --deep:#2B1A15; --deepink:#FFFFFF;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--head);line-height:1.12;margin:0;letter-spacing:-0.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.shell{width:100%;max-width:560px;margin:0 auto;flex:1;padding:0 20px 28px;position:relative}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;margin-top:12px;border-radius:14px;background:linear-gradient(180deg,#8A3F2C,#A9532F);color:#fff;font-family:var(--head);font-weight:700;font-size:18px}
.topbar .linkbtn{color:#fff}.topbar small{color:#fff}.topbar img.mini{filter:invert(1)}
.topbar>span{display:flex;align-items:center}
.topbar small{font-family:var(--body);font-weight:500;font-size:13px}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:13px 20px;font-weight:600;font-size:16px}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* sign in */
.gate{padding-top:56px}
.gate h1{font-size:40px;margin-bottom:12px}
.gate .lede{color:var(--muted);margin-bottom:28px;max-width:44ch}
label{display:block;font-weight:600;margin-bottom:6px}
input[type=text],input[type=email]{width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
input:focus{border-color:var(--accent);outline:none}
.err{font-weight:600;margin-top:12px;border-left:4px solid var(--ink);padding-left:10px}
.demo{margin-top:16px;padding:12px 14px;border:2px solid var(--ink);border-radius:10px;color:var(--muted);font-size:15px}
.demo b{color:var(--ink);font-size:18px;letter-spacing:.12em}
.mark{display:block;width:140px;max-width:50%;height:auto;margin-bottom:28px}
.mini{width:34px;height:34px;vertical-align:middle;margin-right:10px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mark,:root:not([data-theme="light"]) .mini{filter:invert(1)}}
:root[data-theme="dark"] .mark,:root[data-theme="dark"] .mini{filter:invert(1)}
.fine{font-size:13px;color:var(--muted);margin-top:28px;max-width:46ch}

/* home */
.hero{position:relative;padding:36px 0 28px;overflow:hidden}
.hero svg{position:absolute;right:-90px;top:-10px;width:420px;height:420px;z-index:0;pointer-events:none}

.hero>*:not(svg){position:relative;z-index:1}
.hero h1{font-size:44px;max-width:11ch;margin-bottom:16px}
.hero p{color:var(--muted);max-width:42ch;margin-bottom:24px}
.points{border-top:2px solid var(--ink);margin-top:8px}
.points div{padding:18px 0;border-bottom:1px solid var(--line)}
.points h3{font-size:20px;margin-bottom:4px}
.points p{color:var(--muted)}
.note{margin-top:22px;padding:16px 18px;background:var(--soft);border-radius:10px;font-size:14px}

/* list */
.pagehead{padding:28px 0 12px}
.pagehead h1{font-size:34px;margin-bottom:6px}
.pagehead p{color:var(--muted)}
.row{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left-width:6px;border-radius:6px;padding:16px 16px 14px;margin-top:12px}
.row{border-left-color:var(--ink)}
.row h3{font-size:20px;margin-bottom:6px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--muted);font-size:14px}
.bars{display:inline-flex;gap:3px;vertical-align:middle;margin-right:6px}
.bars i{width:6px;height:14px;border-radius:2px;background:var(--line)}
.bars i.on{background:var(--ink)}
.tag{background:var(--soft);border-radius:999px;padding:2px 10px;font-size:13px;color:var(--ink)}
.preview{margin-top:20px;padding:14px 16px;border:2px dashed var(--line);border-radius:10px;font-size:14px;color:var(--muted)}
.preview .btn{margin-top:10px;padding:9px 14px;font-size:14px}

/* detail */
.back{margin-top:18px}
.detail h1{font-size:32px;margin:14px 0 10px}
.detail .desc{font-size:18px;margin-bottom:16px}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;padding:14px 0;border-top:2px solid var(--ink);border-bottom:1px solid var(--line);margin-bottom:8px}
.section{padding:16px 0;border-bottom:1px solid var(--line)}
.section h2{font-size:20px;margin-bottom:8px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:15px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.missing{color:var(--muted);font-style:italic}

/* guide */
.guide h2{font-size:24px;margin:28px 0 10px}
.guide ul,.guide ol{padding-left:20px;margin:8px 0}
.guide li{margin:6px 0}
.status{width:100%;border-collapse:collapse;font-size:15px;margin-top:6px}
.status td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.status td:last-child{text-align:right;font-weight:600;white-space:nowrap;padding-left:12px}
.ok{color:var(--ink)}.warn{color:var(--muted)}.stop{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.callout{padding:14px 16px;background:var(--soft);border-radius:10px;margin:12px 0;font-size:15px}


/* tap targets and new components */
.linkbtn{min-height:44px;padding:10px 0}
.btn{min-height:48px;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.hero{padding:0;margin:14px 0 16px;border-radius:16px;min-height:290px;display:flex;align-items:flex-start;background:linear-gradient(180deg,#8A3F2C 0%,#B5603F 55%,#D98B54 100%)}
.hero svg{position:absolute;inset:0;width:100%;height:100%;right:auto;top:auto}

.hero h1{font-size:31px;max-width:13ch;margin:0;padding:24px 22px;color:#fff;text-shadow:0 1px 8px rgba(40,15,8,.35)}
.how{border:2px solid var(--ink);border-radius:10px;padding:18px;margin:6px 0 18px;background:var(--surface)}
.how h2{font-size:22px;margin-bottom:8px}
.how p+p{margin-top:10px}
.soon{color:var(--muted);font-size:15px}
.stack{display:flex;flex-direction:column;gap:12px}
.stack .btn{width:100%}
.ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.filters{margin-top:6px}
fieldset{border:0;margin:14px 0 0;padding:0;min-width:0}
legend{font-weight:600;margin-bottom:8px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border:2px solid var(--ink);border-radius:999px;background:var(--surface);color:var(--ink);font-weight:500}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.gchip{min-height:44px;padding:0 16px;border:2px solid var(--ink);border-radius:999px;background:var(--surface);color:var(--ink);font-weight:500}
.gchip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.fbar{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.count{color:var(--muted);font-size:15px}
.empty{margin-top:14px;padding:20px;border:2px dashed var(--ink);border-radius:10px;text-align:center}
.srcs{margin:8px 0;padding-left:20px}
.srcs a{color:var(--ink);text-underline-offset:3px;overflow-wrap:anywhere}
.muted{color:var(--muted);font-size:14px}
details{margin-top:12px;border-top:1px solid var(--line);padding-top:4px}
summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:600}
details p{margin-top:8px}
.detail dd{overflow-wrap:anywhere}
.safety h2{font-size:22px;margin:26px 0 8px}
.safety ul{padding-left:20px;margin:8px 0}
.safety li{margin:7px 0}
.banner{background:var(--ink);color:var(--bg);border-radius:10px;padding:18px;margin-top:16px}
.banner .callbtn{display:flex;align-items:center;justify-content:center;min-height:48px;margin-top:14px;background:var(--bg);color:var(--ink);border-radius:10px;font-weight:700;text-decoration:none}
.intro{margin-top:16px}
.links{display:flex;flex-direction:column;gap:10px}
.lnk{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:56px;padding:10px 14px;border:2px solid var(--ink);border-radius:10px;color:var(--ink);text-decoration:none;background:var(--surface)}
.lnk small{display:block;color:var(--muted);font-size:13px}
.disclaimer{border:2px solid var(--ink);border-radius:10px;padding:16px;font-size:15px}
.guide ol li,.guide ul li{overflow-wrap:anywhere}
.field{margin-top:16px}
input[type=password]{width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
input[type=password]:focus{border-color:var(--accent);outline:none}
.note2{margin-top:12px;border-left:4px solid var(--ink);padding-left:10px}


.mapframe{display:block;width:100%;height:180px;border:1px solid var(--line);border-radius:10px;margin:4px 0 12px}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.btnrow .btn{flex:1 1 150px}
.alertbox{border:2px solid var(--ink);border-radius:10px;padding:12px 14px;margin:6px 0 4px;background:var(--soft);font-size:15px}
.check{padding-left:20px;margin:6px 0 12px}
.check li{margin:5px 0}
.eat{padding:10px 0;border-top:1px solid var(--line)}
.pbar{height:8px;border-radius:99px;background:var(--line);margin:8px 0;overflow:hidden}.pbar i{display:block;height:100%;background:var(--ink)}
.share{display:flex;gap:8px;align-items:flex-start;margin:8px 0;font-size:14px}.share input{margin-top:3px;width:20px;height:20px;flex:none}.trip .btn{margin-top:6px;width:100%}.who{margin:8px 0;padding:10px;background:var(--soft);border-radius:10px}
.eat p{margin:2px 0}


/* hero block like the theme mockup */
.hero2{position:relative;overflow:hidden;margin:12px 0 18px;border-radius:20px;color:#fff;background:linear-gradient(180deg,#8A3F2C 0%,#B5603F 55%,#D98B54 100%)}
.hero2 svg.scene{position:absolute;left:0;right:0;bottom:0;width:100%;height:62%;z-index:0;pointer-events:none}
.hero2>*:not(svg){position:relative;z-index:1}
.hbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;background:rgba(58,28,20,.28);font-family:var(--head);font-weight:700;font-size:18px}
.hbar>span{display:flex;align-items:center;gap:10px;white-space:nowrap}
.hbar img{width:28px;height:28px;filter:invert(1)}
.hbar small{font-family:var(--body);font-weight:500;font-size:13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.hbar .linkbtn{color:#fff;min-height:36px;padding:6px 0}
.hcopy{padding:26px 20px 30px}
.hcopy h1{font-size:40px;max-width:10ch;color:#fff;text-shadow:0 1px 10px rgba(40,15,8,.3)}
.hcopy p{margin-top:10px;max-width:30ch;color:#fff;font-size:17px;text-shadow:0 1px 6px rgba(40,15,8,.3)}
.hcopy .btn{margin-top:22px;background:#4A1D12;color:#fff;border-radius:12px}
.hero2.tall .hcopy{padding-bottom:180px}
.hero2.short .hcopy{padding-bottom:120px}
.hero2.tall svg.scene{height:48%}
.hero2.short svg.scene{height:44%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.card label{display:block;margin-top:14px;font-weight:600}
.card .lede{margin-bottom:6px}
.fcard{display:block;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:10px}
.fmain{display:block;width:100%;text-align:left;background:none;border:0;padding:0}
.fmain h3{font-size:19px;color:var(--accent);margin-bottom:4px}
.fmain .meta{color:var(--muted);font-size:15px}
.fsafe{color:#B42318;font-weight:700;text-decoration:none;display:inline-block;padding:6px 0 0;min-height:0}
h2.sec{font-size:22px;margin:22px 0 4px}

/* full page scene behind the sign in and home pages */
.scenebg{display:none;position:fixed;top:0;bottom:0;left:50%;width:min(100%,560px);transform:translateX(-50%);z-index:0;pointer-events:none}
.scenebg svg{display:block;width:100%;height:100%}
.scenebg svg.wide{display:none}
body.scene{background:#2B130D}
body.scene .scenebg{display:block}
body.scene .waves{display:none}
body.scene .shell{position:relative;z-index:1}
body.scene .hero2{background:none;overflow:visible;border-radius:0;margin-top:8px}
body.scene .hbar{background:rgba(40,16,10,.45);border-radius:14px}
body.scene .hcopy{padding:30px 6px 0}
body.scene .hero2.short .hcopy{padding-bottom:230px}
body.scene .hero2.tall .hcopy{padding-bottom:210px}
body.scene .fine,body.scene h2.sec{color:#FBEBDD;text-shadow:0 1px 6px rgba(30,10,5,.5)}
body.scene .card,body.scene .how,body.scene .fcard{box-shadow:0 6px 24px rgba(20,8,4,.35)}
/* waves rising from the bottom */
.waves{position:relative;margin-top:auto}
.waves svg{display:block;width:100%;height:150px}
.waves .back{fill:var(--line)}
.waves .front{fill:var(--deep)}
.waves .base{background:var(--deep);height:env(safe-area-inset-bottom,0px)}
.waves.withnav .base{height:calc(62px + env(safe-area-inset-bottom,0px))}
/* nav */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);background:var(--deep);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;border:0;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:500;color:var(--deepink);opacity:.7}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current=page]{opacity:1;font-weight:600}
nav{border-top:0}
.hidden{display:none}
@media (prefers-reduced-motion:no-preference){.view{animation:in .18s ease-out}@keyframes in{from{opacity:0}to{opacity:1}}}

.gal{position:relative;margin:12px 0 4px}
.gal .gt{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;border-radius:14px;scrollbar-width:none}
.gal .gt::-webkit-scrollbar{display:none}
.gal .gt img{flex:0 0 100%;width:100%;height:auto;max-height:340px;object-fit:cover;scroll-snap-align:center;background:#eadfd8}
.gal .ga{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:0;background:rgba(58,28,20,.65);color:#fff;font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.gal .ga:hover{background:rgba(58,28,20,.9)}.gal .gp{left:8px}.gal .gn{right:8px}
.gal .gc{position:absolute;right:10px;bottom:10px;background:rgba(58,28,20,.7);color:#fff;font-size:13px;padding:3px 9px;border-radius:12px}

/* laptop and desktop widths */
.agrid{display:block}
@media (min-width:900px){
.shell{max-width:1080px;padding:0 32px 96px}
.scenebg{width:100%}
.scenebg svg.narrow{display:none}
.scenebg svg.wide{display:block}
nav{left:0;transform:none;width:100%;justify-content:center;gap:56px}
nav button{flex:0 0 150px}
.hero2 .hcopy h1{font-size:54px;max-width:14ch}
.hero2 .hcopy p{font-size:20px}
.hero2.tall .hcopy{padding-bottom:230px}
.hero2.short ~ .card,.hero2.short ~ .fine{max-width:520px;margin-left:auto;margin-right:auto}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:12px}
.agrid .row,.agrid .fcard{margin-top:0}
.agrid .fcard{height:100%}
.view.detail,.view.safety{max-width:860px;margin-left:auto;margin-right:auto}
.gal .gt img{max-height:460px}
.pagehead h1{font-size:40px}
}
@media (min-width:1300px){.shell{max-width:1200px}}
</style>
</head>
<body>
<div class="scenebg" id="scenebg" aria-hidden="true"><svg class="narrow" viewBox="0 0 560 800" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">

hind the library."], "A10": ["Waiwharariki Anzac Square, 38 Hurstmere Road, Takapuna", "Waiwharariki Anzac Square, 38 Hurstmere Road, Takapuna, Auckland", "Waiwharariki Anzac Square, 38 Hurstmere Road, Takapuna, Auckland", "2-3 h (Ref 9 estimate)", "2 to 3 hours. Sundays only. Market dates for 2026 are still being confirmed."], "A11": ["The Landing ferry stop", "The Landing, Hobsonville Point, Auckland", "Downtown Ferry Terminal, 99 Quay Street, Auckland CBD", "Back at The Landing (loop)", "5.5 km loop, about 1.5 hours. Getting back: Fullers ferry from The Landing to Downtown Ferry Terminal. Weekend ferries can be limited, so check the timetable first."], "A12": ["Ambury Regional Park, Māngere Bridge", "Ambury Regional Park, Māngere Bridge, Auckland", "Onehunga Station, Auckland", "5.25 km, about 1 h (Ref 9)", "5.25 km loop, about 1 hour, with shorter loops available. The park entrance address is still being confirmed. Nearest train station is Onehunga."], "A13": ["Visitor centre, 102 Hill Road, Manurewa", "102 Hill Road, Manurewa, Auckland", "102 Hill Road, Manurewa, Auckland", "Flexible paths, 2-3 h (Ref 9 estimate)", "Flexible paths, 2 to 3 hours. Open 7am to 6pm daily, free. Same way back to the visitor centre."], "A14": ["731 Great North Road, Western Springs (enter from Great North Rd or Motions Rd)", "731 Great North Road, Western Springs, Auckland", "731 Great North Road, Western Springs, Auckland", "1.8 km loop (Ref 9), 30 min-1 h", "1.8 km loop, 30 min to 1 hour. Enter from Great North Road or Motions Road. Same way back."], "A15": ["Car park behind Ōtara Town Centre, Ōtara", "Ōtara Town Centre, Newbury Street, Ōtara, Auckland", "Ōtara Town Centre, Newbury Street, Ōtara, Auckland", "1-2 h", "1 to 2 hours. Saturdays only, 6am to 12pm. The street address is from map listings, so look for the car park behind the town centre."]};

  var NEWW = {"A06": {"backup": "Auckland Museum, Auckland Domain", "why": "The park paths, courtyard and fernery are outdoors. Heavy rain, strong wind or heat can affect the wider park outing. The two glasshouses provide partial cover, so light rain does not automatically prevent a visit.", "whyBackup": "Indoor galleries in the same Domain area offer a cultural outing without a cross-city journey. Auckland residents can obtain free general admission with address proof. Other admission charges may apply.", "src": [["Original activity page", "https://new.aucklandcouncil.govt.nz/en/parks-recreation/find-park-beach/park-detail/126.html"], ["Backup: Auckland Museum", "https://www.aucklandmuseum.com/visit/plan-your-visit/hours-and-admission"]], "date": "9 Oct 2026", "note": "Check museum opening hours before you go. The Wintergardens close at 4:30pm until 31 October. Admission to the museum may cost extra."}, "A07": {"backup": "Westfield Newmarket, indoor browsing and food court", "why": "This is an outdoor summit route. Council describes some tracks as stony and steep. Rain can reduce grip, and strong winds or poor visibility can make the summit outing less suitable.", "whyBackup": "An indoor Newmarket outing avoids the exposed summit and steep tracks. Browsing does not require a purchase. It is a different type of activity, but provides a practical nearby-area option with later trading hours.", "src": [["Original activity page", "https://new.aucklandcouncil.govt.nz/en/parks-recreation/get-outdoors/aklpaths/path-detail/393.html"], ["Backup: Westfield Newmarket", "https://www.westfield.co.nz/newmarket/opening-hours"]], "date": "9 Oct 2026", "note": "The backup is in Newmarket, away from the summit, so it needs a short trip. Check individual shop hours. Food and transport cost extra."}, "A08": {"backup": "SEA LIFE Kelly Tarlton’s Aquarium, Ōkahu Bay", "why": "The waterfront and beach sections are outdoors and exposed. Heavy rain, strong coastal winds and heat can affect walking comfort. Optional swimming requires its own conditions check.", "whyBackup": "The aquarium is an all-weather indoor attraction on Tāmaki Drive. It keeps a coastal/marine theme while avoiding a long exposed waterfront walk. Admission is paid and requires a budget decision.", "src": [["Original activity page", "https://new.aucklandcouncil.govt.nz/en/parks-recreation/get-outdoors/aklpaths/path-detail/246.html"], ["Backup: SEA LIFE Kelly Tarlton’s Aquarium", "https://www.visitsealife.com/auckland/plan-your-day/before-you-visit/opening-hours/"]], "date": "9 Oct 2026", "note": "Aquarium hours are 9:30am to 5pm with last entry at 4pm. Tickets are paid. Check tickets, time slots and transport alerts first."}, "A09": {"backup": "Auckland Museum, Auckland Domain", "why": "The market is an outdoor car-park outing. Its organiser says it trades in rain or sunshine, so ordinary rain is not an automatic cancellation. Heavy rain or strong wind can still affect visitor comfort and access.", "whyBackup": "Indoor galleries offer a cultural visit in the adjoining Domain area rather than an exposed market stroll. Auckland residents should bring address proof for free general admission. Other admission charges may apply.", "src": [["Original activity page", "https://villagesquare.org.nz/parnell-farmers-market"], ["Backup: Auckland Museum", "https://www.aucklandmuseum.com/visit/plan-your-visit/hours-and-admission"]], "date": "9 Oct 2026", "note": "Check the museum opening time before you go. Walking from the market to the Domain is still outdoors."}, "A10": {"backup": "Shore City Shopping Centre, Takapuna", "why": "The beach and market stroll are mainly outdoors. Strong wind, heavy rain or heat can reduce suitability. A weather-dependent flag does not mean the Sunday market necessarily closes in light rain.", "whyBackup": "Indoor browsing and a food-court break provide a town-centre alternative without travelling back across the harbour. The venue is in the same Takapuna area, but   function loadTrips(a){
    var box=document.getElementById("trips");if(!box||!db||!state.uid)return;
    var today=new Date().toISOString().slice(0,10),col=db.collection("trips");
    var open=col.where("activityId","==",a.id).where("womenOnly","==",false).get();
    var women=col.where("activityId","==",a.id).where("womenOnly","==",true).get().then(function(r){return r},function(){return null});
    Promise.all([open,women]).then(function(res){
      var list=[];
      res.forEach(function(r,i){if(r)r.forEach(function(d){var x=d.data();x.id=d.id;x.women=(i===1);list.push(x)})});
      list=list.filter(function(x){return x.date>=today}).sort(function(p,q){return (p.date+p.time)<(q.date+q.time)?-1:1});
      return Promise.all(list.map(function(x){return col.doc(x.id).collection("members").doc(state.uid).get().then(function(m){x.mine=m.exists;return x},function(){x.mine=false;return x})}));

      Array.prototype.forEach.call(box.querySelectorAll(".leave"),function(b){b.onclick=function(){leaveTrip(b,a)}});
      list.forEach(function(x){if(x.mine&&(x.joined||0)>=need(x))loadWho(x)});

  }

    }
    h+='<div class="section"><h2>Spotted something wrong?</h2><p>Tell us if a time, link or detail on this page is out of date. Please type the activity name ('+esc(a.name)+') in the form.</p><p style="margin-top:12px">'+ext(FORM_URL,"Report a problem","btn ghost")+'</p></div>';
    return h+'</div>';
  }

  /* ---------- safety and disclaimer (Ref 4 copy from Namua's brief) ---------- */
  function ul(items){return '<ul>'+items.map(function(i){return '<li>'+esc(i)+'</li>'}).join('')+'</ul>'}
  function safetyView(){
    var h='<div class="view safety">'+topbar()+'<div class="pagehead"><h1>Safety &amp; Disclaimer</h1></div>'+
    '<div class="banner"><p>In an emergency in New Zealand, call <b>111</b> and ask for Police, Fire or Ambulance. If you are lost or injured outdoors and have no signal, still try 111.</p><a class="callbtn" href="tel:111">Call 111 (emergency)</a><p style="margin-top:10px">On campus: University of Auckland Campus Security, <a href="tel:08003737550"><b>0800 3737 550</b></a>.</p></div>'+
    '<p class="intro">NZ Explorer helps you find weekend activities and other students to go with. Please read this before you go out, especially if you are meeting people you have not met before.</p>'+
    '<h2>Before you go</h2>'+ul(["Choose an activity that fits your fitness, experience and the time you have.","Check the weather forecast on the day and be ready to change plans.","Pack warm layers, water, food, sunscreen and a charged phone.","Tell a friend or flatmate where you are going, who with, and when you will be back.","For bush walks, leave your trip plan with someone you trust using the AdventureSmart Outdoors Intentions form."])+
    '<h2>When meeting students you have just met</h2>'+ul(["Meet first in a busy public place, such as a bus stop or the city centre, and travel together from there.","Share only your first name and the group chat until you feel comfortable.","Stay with the group. Do not leave anyone behind.","You can leave or say no at any time. You do not need to give a reason.","If someone makes you feel unsafe, leave, contact Police (111 in an emergency, 105 otherwise) and report it to the NZ Explorer team."])+
    '<h2>Around water and on the coast</h2>'+ul(["Check tides and water quality before you go. Swim at patrolled beaches between the flags.","Know your limits. NZ water can be colder and rougher than it looks."])+
    '<h2>Safety links</h2><div class="links">';
    LINKS.forEach(function(l){h+='<a class="lnk" href="'+esc(l[2])+'" target="_blank" rel="noopener"><span><b>'+esc(l[0])+'</b><small>'+esc(l[1])+'</small></span><span aria-hidden="true">&#8599;</span></a>'});
    h+='</div><h2>Disclaimer</h2><div class="disclaimer"><p>NZ Explorer is a student pilot project built for a University of Auckland course. It is not an official University service, tour operator or safety authority. Activity, transport and weather information is collected from public sources and checked by hand; it may be out of date or wrong, so always confirm details with the official source before you go. NZ Explorer does not organise, supervise or insure any activity, and does not screen or verify the people you meet through the app beyond the university email sign up. You take part at your own risk and are responsible for your own safety and decisions. If you are unsure about an activity or a person, do not go.</p></div></div>';
    return h;
  }

  /* ---------- shell ---------- */
  new MutationObserver(function(){document.body.classList.toggle("scene",!!app.querySelector(".hero2"))}).observe(app,{childList:true});
  document.body.classList.toggle("scene",!!app.querySelector(".hero2"));
  function render(){
    if(!state.user){renderGate();return}
    nav.classList.remove("hidden");waves.classList.add("withnav");
    var v=state.tab==="home"?homeView():state.tab==="safety"?safetyView():state.tab==="profile"?profileView():(state.sel!==null?detailView():listView());
    app.innerHTML=v;
    Array.prototype.forEach.call(nav.querySelectorAll("button"),function(b){
      if(b.dataset.tab===state.tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");
    });
    bind();
    if(state.tab==="activities"&&state.sel!==null)loadTrips(A[state.sel]);
    if(state.tab==="profile")bindProfile();
    window.scrollTo(0,0);
  }
  function rerenderList(){app.innerHTML=listView();bind()}
  function bind(){
    var o=document.getElementById("out");if(o)o.onclick=function(){if(auth)auth.signOut();state.user=null;state.name="";state.mode="signin";state.step="email";state.email="";state.error="";state.profile={name:"",age:"",gender:""};state.gender="";state.uid=null;state.gmsg="";state.sel=null;state.f={dur:"Any",diff:"Any"};render()};
    Array.prototype.forEach.call(app.querySelectorAll("[data-go]"),function(b){b.onclick=function(){state.tab=b.dataset.go;state.sel=null;render()}});
    Array.prototype.forEach.call(app.querySelectorAll(".row"),function(b){b.onclick=function(){state.sel=+b.dataset.i;render()}});
    Array.prototype.forEach.call(app.querySelectorAll("[data-feat]"),function(b){b.onclick=function(){state.tab="activities";state.sel=+b.dataset.feat;render()}});
    Array.prototype.forEach.call(app.querySelectorAll(".chip"),function(b){b.onclick=function(){state.f[b.dataset.f]=b.dataset.v;rerenderList()}});
    Array.prototype.forEach.call(app.querySelectorAll("[data-clear]"),function(b){b.onclick=function(){state.f={dur:"Any",diff:"Any"};rerenderList()}});
    var gt=document.getElementById("gt");if(gt){var gc=document.getElementById("gc"),n=gt.children.length,go=function(d){var w=gt.clientWidth,k=Math.round(gt.scrollLeft/w)+d;if(k<0)k=n-1;if(k>=n)k=0;gt.scrollTo({left:k*w,behavior:"smooth"})};gt.addEventListener("scroll",function(){if(gc)gc.textContent=(Math.round(gt.scrollLeft/gt.clientWidth)+1)+" / "+n});var gp=document.getElementById("gp"),gx=document.getElementById("gnx");if(gp)gp.onclick=function(){go(-1)};if(gx)gx.onclick=function(){go(1)}}
    var bk=document.getElementById("bk");if(bk)bk.onclick=function(){state.sel=null;render()};
  }
  nav.addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;state.tab=b.dataset.tab;state.sel=null;render();
  });

  render();
})();

</script>
</body>
</html>
