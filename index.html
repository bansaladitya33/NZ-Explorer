<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:0;
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#1F1410; --muted:#5B4A43; --line:#DCCBC3;
  --accent:#93442F; --accent-ink:#FFFFFF; --soft:#F8EFEA; --deep:#3A1C14; --deepink:#FFFFFF;
  --head:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#140C0A; --surface:#1E1411; --ink:#FFFFFF; --muted:#C4B0A8; --line:#4A352D;
    --accent:#E2937E; --accent-ink:#1A0E0A; --soft:#2A1C17; --deep:#2B1A15; --deepink:#FFFFFF;
  }
}
:root[data-theme="dark"]{
  --bg:#140C0A; --surface:#1E1411; --ink:#FFFFFF; --muted:#C4B0A8; --line:#4A352D;
  --accent:#E2937E; --accent-ink:#1A0E0A; --soft:#2A1C17; --deep:#2B1A15; --deepink:#FFFFFF;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--head);line-height:1.12;margin:0;letter-spacing:-0.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.shell{width:100%;max-width:560px;margin:0 auto;flex:1;padding:0 20px 28px;position:relative}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;margin-top:12px;border-radius:14px;background:linear-gradient(180deg,#8A3F2C,#A9532F);color:#fff;font-family:var(--head);font-weight:700;font-size:18px}
.topbar .linkbtn{color:#fff}.topbar small{color:#fff}.topbar img.mini{filter:invert(1)}
.topbar>span{display:flex;align-items:center}
.topbar small{font-family:var(--body);font-weight:500;font-size:13px}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:13px 20px;font-weight:600;font-size:16px}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* sign in */
.gate{padding-top:56px}
.gate h1{font-size:40px;margin-bottom:12px}
.gate .lede{color:var(--muted);margin-bottom:28px;max-width:44ch}
label{display:block;font-weight:600;margin-bottom:6px}
input[type=text],input[type=email]{width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
input:focus{border-color:var(--accent);outline:none}
.err{font-weight:600;margin-top:12px;border-left:4px solid var(--ink);padding-left:10px}
.demo{margin-top:16px;padding:12px 14px;border:2px solid var(--ink);border-radius:10px;color:var(--muted);font-size:15px}
.demo b{color:var(--ink);font-size:18px;letter-spacing:.12em}
.mark{display:block;width:140px;max-width:50%;height:auto;margin-bottom:28px}
.mini{width:34px;height:34px;vertical-align:middle;margin-right:10px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mark,:root:not([data-theme="light"]) .mini{filter:invert(1)}}
:root[data-theme="dark"] .mark,:root[data-theme="dark"] .mini{filter:invert(1)}
.fine{font-size:13px;color:var(--muted);margin-top:28px;max-width:46ch}

/* home */
.hero{position:relative;padding:36px 0 28px;overflow:hidden}
.hero svg{position:absolute;right:-90px;top:-10px;width:420px;height:420px;z-index:0;pointer-events:none}

.hero>*:not(svg){position:relative;z-index:1}
.hero h1{font-size:44px;max-width:11ch;margin-bottom:16px}
.hero p{color:var(--muted);max-width:42ch;margin-bottom:24px}
.points{border-top:2px solid var(--ink);margin-top:8px}
.points div{padding:18px 0;border-bottom:1px solid var(--line)}
.points h3{font-size:20px;margin-bottom:4px}
.points p{color:var(--muted)}
.note{margin-top:22px;padding:16px 18px;background:var(--soft);border-radius:10px;font-size:14px}

/* list */
.pagehead{padding:28px 0 12px}
.pagehead h1{font-size:34px;margin-bottom:6px}
.pagehead p{color:var(--muted)}
.row{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left-width:6px;border-radius:6px;padding:16px 16px 14px;margin-top:12px}
.row{border-left-color:var(--ink)}
.row h3{font-size:20px;margin-bottom:6px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--muted);font-size:14px}
.bars{display:inline-flex;gap:3px;vertical-align:middle;margin-right:6px}
.bars i{width:6px;height:14px;border-radius:2px;background:var(--line)}
.bars i.on{background:var(--ink)}
.tag{background:var(--soft);border-radius:999px;padding:2px 10px;font-size:13px;color:var(--ink)}
.preview{margin-top:20px;padding:14px 16px;border:2px dashed var(--line);border-radius:10px;font-size:14px;color:var(--muted)}
.preview .btn{margin-top:10px;padding:9px 14px;font-size:14px}

/* detail */
.back{margin-top:18px}
.detail h1{font-size:32px;margin:14px 0 10px}
.detail .desc{font-size:18px;margin-bottom:16px}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;padding:14px 0;border-top:2px solid var(--ink);border-bottom:1px solid var(--line);margin-bottom:8px}
.section{padding:16px 0;border-bottom:1px solid var(--line)}
.section h2{font-size:20px;margin-bottom:8px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:15px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.missing{color:var(--muted);font-style:italic}

/* guide */
.guide h2{font-size:24px;margin:28px 0 10px}
.guide ul,.guide ol{padding-left:20px;margin:8px 0}
.guide li{margin:6px 0}
.status{width:100%;border-collapse:collapse;font-size:15px;margin-top:6px}
.status td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.status td:last-child{text-align:right;font-weight:600;white-space:nowrap;padding-left:12px}
.ok{color:var(--ink)}.warn{color:var(--muted)}.stop{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.callout{padding:14px 16px;background:var(--soft);border-radius:10px;margin:12px 0;font-size:15px}


/* tap targets and new components */
.linkbtn{min-height:44px;padding:10px 0}
.btn{min-height:48px;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.hero{padding:0;margin:14px 0 16px;border-radius:16px;min-height:290px;display:flex;align-items:flex-start;background:linear-gradient(180deg,#8A3F2C 0%,#B5603F 55%,#D98B54 100%)}
.hero svg{position:absolute;inset:0;width:100%;height:100%;right:auto;top:auto}

.hero h1{font-size:31px;max-width:13ch;margin:0;padding:24px 22px;color:#fff;text-shadow:0 1px 8px rgba(40,15,8,.35)}
.how{border:2px solid var(--ink);border-radius:10px;padding:18px;margin:6px 0 18px;background:var(--surface)}
.how h2{font-size:22px;margin-bottom:8px}
.how p+p{margin-top:10px}
.soon{color:var(--muted);font-size:15px}
.stack{display:flex;flex-direction:column;gap:12px}
.stack .btn{width:100%}
.ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.filters{margin-top:6px}
fieldset{border:0;margin:14px 0 0;padding:0;min-width:0}
legend{font-weight:600;margin-bottom:8px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border:2px solid var(--ink);border-radius:999px;background:var(--surface);color:var(--ink);font-weight:500}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.gchip{min-height:44px;padding:0 16px;border:2px solid var(--ink);border-radius:999px;background:var(--surface);color:var(--ink);font-weight:500}
.gchip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.fbar{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.count{color:var(--muted);font-size:15px}
.empty{margin-top:14px;padding:20px;border:2px dashed var(--ink);border-radius:10px;text-align:center}
.srcs{margin:8px 0;padding-left:20px}
.srcs a{color:var(--ink);text-underline-offset:3px;overflow-wrap:anywhere}
.muted{color:var(--muted);font-size:14px}
details{margin-top:12px;border-top:1px solid var(--line);padding-top:4px}
summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:600}
details p{margin-top:8px}
.detail dd{overflow-wrap:anywhere}
.safety h2{font-size:22px;margin:26px 0 8px}
.safety ul{padding-left:20px;margin:8px 0}
.safety li{margin:7px 0}
.banner{background:var(--ink);color:var(--bg);border-radius:10px;padding:18px;margin-top:16px}
.banner .callbtn{display:flex;align-items:center;justify-content:center;min-height:48px;margin-top:14px;background:var(--bg);color:var(--ink);border-radius:10px;font-weight:700;text-decoration:none}
.intro{margin-top:16px}
.links{display:flex;flex-direction:column;gap:10px}
.lnk{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:56px;padding:10px 14px;border:2px solid var(--ink);border-radius:10px;color:var(--ink);text-decoration:none;background:var(--surface)}
.lnk small{display:block;color:var(--muted);font-size:13px}
.disclaimer{border:2px solid var(--ink);border-radius:10px;padding:16px;font-size:15px}
.guide ol li,.guide ul li{overflow-wrap:anywhere}
.field{margin-top:16px}
input[type=password]{width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
input[type=password]:focus{border-color:var(--accent);outline:none}
.note2{margin-top:12px;border-left:4px solid var(--ink);padding-left:10px}


.mapframe{display:block;width:100%;height:180px;border:1px solid var(--line);border-radius:10px;margin:4px 0 12px}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.btnrow .btn{flex:1 1 150px}
.alertbox{border:2px solid var(--ink);border-radius:10px;padding:12px 14px;margin:6px 0 4px;background:var(--soft);font-size:15px}
.check{padding-left:20px;margin:6px 0 12px}
.check li{margin:5px 0}
.eat{padding:10px 0;border-top:1px solid var(--line)}
.pbar{height:8px;border-radius:99px;background:var(--line);margin:8px 0;overflow:hidden}.pbar i{display:block;height:100%;background:var(--ink)}
.share{display:flex;gap:8px;align-items:flex-start;margin:8px 0;font-size:14px}.share input{margin-top:3px;width:20px;height:20px;flex:none}.trip .btn{margin-top:6px;width:100%}.who{margin:8px 0;padding:10px;background:var(--soft);border-radius:10px}
.eat p{margin:2px 0}


/* hero block like the theme mockup */
.hero2{position:relative;overflow:hidden;margin:12px 0 18px;border-radius:20px;color:#fff;background:linear-gradient(180deg,#8A3F2C 0%,#B5603F 55%,#D98B54 100%)}
.hero2 svg.scene{position:absolute;left:0;right:0;bottom:0;width:100%;height:62%;z-index:0;pointer-events:none}
.hero2>*:not(svg){position:relative;z-index:1}
.hbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;background:rgba(58,28,20,.28);font-family:var(--head);font-weight:700;font-size:18px}
.hbar>span{display:flex;align-items:center;gap:10px;white-space:nowrap}
.hbar img{width:28px;height:28px;filter:invert(1)}
.hbar small{font-family:var(--body);font-weight:500;font-size:13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.hbar .linkbtn{color:#fff;min-height:36px;padding:6px 0}
.hcopy{padding:26px 20px 30px}
.hcopy h1{font-size:40px;max-width:10ch;color:#fff;text-shadow:0 1px 10px rgba(40,15,8,.3)}
.hcopy p{margin-top:10px;max-width:30ch;color:#fff;font-size:17px;text-shadow:0 1px 6px rgba(40,15,8,.3)}
.hcopy .btn{margin-top:22px;background:var(--deep);box-shadow:0 0 0 1px rgba(255,255,255,.25);color:#fff;border-radius:12px}
.hero2.tall .hcopy{padding-bottom:180px}
.hero2.short .hcopy{padding-bottom:120px}
.hero2.tall svg.scene{height:48%}
.hero2.short svg.scene{height:44%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.card label{display:block;margin-top:14px;font-weight:600}
.card .lede{margin-bottom:6px}
.fcard{display:block;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:10px}
.fmain{display:block;width:100%;text-align:left;background:none;border:0;padding:0}
.fmain h3{font-size:19px;color:var(--accent);margin-bottom:4px}
.fmain .meta{color:var(--muted);font-size:15px}
.fsafe{color:#B42318;font-weight:700;text-decoration:none;display:inline-block;padding:6px 0 0;min-height:0}
h2.sec{font-size:22px;margin:22px 0 4px}

/* full page scene behind the sign in and home pages */
.scenebg{display:none;position:fixed;top:0;bottom:0;left:50%;width:min(100%,560px);transform:translateX(-50%);z-index:0;pointer-events:none}
.scenebg svg{display:block;width:100%;height:100%}
.scenebg svg.wide{display:none}
body.scene{background:#2B130D}
body.scene .scenebg{display:block}
body.scene .waves{display:none}
body.scene .shell{position:relative;z-index:1}
body.scene .hero2{background:none;overflow:visible;border-radius:0;margin-top:8px}
body.scene .hbar{background:rgba(40,16,10,.45);border-radius:14px}
body.scene .hcopy{padding:30px 6px 0}
body.scene .hero2.short .hcopy{padding-bottom:230px}
body.scene .hero2.tall .hcopy{padding-bottom:210px}
body.scene .fine,body.scene h2.sec{color:#FBEBDD;text-shadow:0 1px 6px rgba(30,10,5,.5)}
body.scene .card,body.scene .how,body.scene .fcard{box-shadow:0 6px 24px rgba(20,8,4,.35)}
/* waves rising from the bottom */
.waves{position:relative;margin-top:auto}
.waves svg{display:block;width:100%;height:150px}
.waves .back{fill:var(--line)}
.waves .front{fill:var(--deep)}
.waves .base{background:var(--deep);height:env(safe-area-inset-bottom,0px)}
.waves.withnav .base{height:calc(62px + env(safe-area-inset-bottom,0px))}
/* nav */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);background:var(--deep);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;border:0;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:500;color:var(--deepink);opacity:.7}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current=page]{opacity:1;font-weight:600}
nav{border-top:0}
.hidden{display:none}
@media (prefers-reduced-motion:no-preference){.view{animation:in .18s ease-out}@keyframes in{from{opacity:0}to{opacity:1}}}

.gal{position:relative;margin:12px 0 4px}
.gal .gt{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;border-radius:14px;scrollbar-width:none}
.gal .gt::-webkit-scrollbar{display:none}
.gal .gt img{flex:0 0 100%;width:100%;height:auto;max-height:340px;object-fit:cover;scroll-snap-align:center;background:#eadfd8}
.gal .ga{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:0;background:rgba(58,28,20,.65);color:#fff;font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.gal .ga:hover{background:rgba(58,28,20,.9)}.gal .gp{left:8px}.gal .gn{right:8px}
.gal .gc{position:absolute;right:10px;bottom:10px;background:rgba(58,28,20,.7);color:#fff;font-size:13px;padding:3px 9px;border-radius:12px}

/* laptop and desktop widths */
.agrid{display:block}
@media (min-width:900px){
.shell{max-width:1080px;padding:0 32px 96px}
.scenebg{width:100%}
.scenebg svg.narrow{display:none}
.scenebg svg.wide{display:block}
nav{left:0;transform:none;width:100%;justify-content:center;gap:56px}
nav button{flex:0 0 150px}
.hero2 .hcopy h1{font-size:54px;max-width:14ch}
.hero2 .hcopy p{font-size:20px}
.hero2.tall .hcopy{padding-bottom:230px}
.hero2.short ~ .card,.hero2.short ~ .fine{max-width:520px;margin-left:auto;margin-right:auto}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:12px}
.agrid .row,.agrid .fcard{margin-top:0}
.agrid .fcard{height:100%}
.view.detail,.view.safety{max-width:860px;margin-left:auto;margin-right:auto}
.gal .gt img{max-height:460px}
.pagehead h1{font-size:40px}
}
@media (min-width:1300px){.shell{max-width:1200px}}

.wxbox{margin:12px 0 4px;padding:12px 14px;border-radius:12px;background:var(--soft);border:1px solid var(--line)}
.wxnow{font-size:15px;margin-bottom:8px}.wxnow b{font-size:20px}
.wxdays{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wxday{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;line-height:1.4}
.wxday b{display:block}.wxwarn{margin-top:8px;font-weight:600;color:var(--accent)}

/* user chosen looks */
:root[data-look="harbour"]{--bg:#FFFFFF;--surface:#FFFFFF;--ink:#0F1F24;--muted:#4A5B61;--line:#C9DCE2;--accent:#155E75;--accent-ink:#FFFFFF;--soft:#EAF3F6;--deep:#0E2F3A;--deepink:#FFFFFF}
:root[data-look="harbour"] .topbar{background:linear-gradient(180deg,#0E2F3A,#1C6F8A)}
:root[data-look="harbour"] body.scene{background:#0B1E26}
:root[data-look="harbour"] .hbar{background:rgba(0,0,0,.32)}
:root[data-look="forest"]{--bg:#FFFFFF;--surface:#FFFFFF;--ink:#10201A;--muted:#4A5A50;--line:#CFE0D4;--accent:#245B45;--accent-ink:#FFFFFF;--soft:#EAF2EC;--deep:#142B21;--deepink:#FFFFFF}
:root[data-look="forest"] .topbar{background:linear-gradient(180deg,#142B21,#2F6B4F)}
:root[data-look="forest"] body.scene{background:#0E1E16}
:root[data-look="forest"] .hbar{background:rgba(0,0,0,.32)}
:root[data-look="dusk"]{--bg:#FFFFFF;--surface:#FFFFFF;--ink:#1B1426;--muted:#5A5068;--line:#DCD3EA;--accent:#5B3F8C;--accent-ink:#FFFFFF;--soft:#F0ECF6;--deep:#24183A;--deepink:#FFFFFF}
:root[data-look="dusk"] .topbar{background:linear-gradient(180deg,#24183A,#5B3F8C)}
:root[data-look="dusk"] body.scene{background:#160F24}
:root[data-look="dusk"] .hbar{background:rgba(0,0,0,.32)}
:root[data-look="mono"]{--bg:#FFFFFF;--surface:#FFFFFF;--ink:#111111;--muted:#555555;--line:#D9D9D9;--accent:#1F1F1F;--accent-ink:#FFFFFF;--soft:#F2F2F2;--deep:#111111;--deepink:#FFFFFF}
:root[data-look="mono"] .topbar{background:linear-gradient(180deg,#111111,#3A3A3A)}
:root[data-look="mono"] body.scene{background:#0D0D0D}
:root[data-look="mono"] .hbar{background:rgba(0,0,0,.32)}
:root[data-look="mono"] .mini,:root[data-look="mono"] .mark{filter:none}
:root[data-size="large"] .shell,:root[data-size="large"] nav{zoom:1.12}
.lkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0 18px}
.lk{border:2px solid var(--line);border-radius:12px;padding:0;background:var(--surface);color:var(--ink);text-align:left;overflow:hidden;cursor:pointer}
.lk[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.lk i{display:block;height:58px}.lk span{display:block;padding:8px 10px;font-weight:600;font-size:14px}

.umenu{position:relative;margin-left:auto}
.mbtn{background:rgba(255,255,255,.14);border:0;border-radius:10px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.mbtn svg{width:24px;height:24px;stroke:#fff;stroke-width:2.2;fill:none;stroke-linecap:round}
.mlist{position:absolute;right:0;top:50px;min-width:210px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.25);padding:6px;z-index:20}
.mlist[hidden]{display:none}
.mwho{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:4px;font-weight:600;font-size:15px}.mwho small{display:block;font-weight:400;font-size:12px;color:var(--muted);word-break:break-all}
.mlist button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px;border-radius:8px;font:inherit;font-size:15px;color:var(--ink);cursor:pointer}
.mlist button:hover,.mlist button:focus-visible{background:var(--soft)}
.mlist #out{color:var(--accent);font-weight:600}
.topbar,.hbar{overflow:visible}
.hero2>.hbar,.topbar{position:relative;z-index:30}

.scenebg svg.sc{display:none!important}
:root[data-look="harbour"] .scenebg svg:not(.sc){display:none!important}
:root[data-look="harbour"] .scenebg svg.sc-harbour.narrow{display:block!important}
:root[data-look="forest"] .scenebg svg:not(.sc){display:none!important}
:root[data-look="forest"] .scenebg svg.sc-forest.narrow{display:block!important}
:root[data-look="dusk"] .scenebg svg:not(.sc){display:none!important}
:root[data-look="dusk"] .scenebg svg.sc-dusk.narrow{display:block!important}
:root[data-look="mono"] .scenebg svg:not(.sc){display:none!important}
:root[data-look="mono"] .scenebg svg.sc-mono.narrow{display:block!important}
:root[data-look="night"] .scenebg svg:not(.sc){display:none!important}
:root[data-look="night"] .scenebg svg.sc-night.narrow{display:block!important}
@media (min-width:900px){
:root[data-look="harbour"] .scenebg svg.sc-harbour.narrow{display:none!important}
:root[data-look="harbour"] .scenebg svg.sc-harbour.wide{display:block!important}
:root[data-look="forest"] .scenebg svg.sc-forest.narrow{display:none!important}
:root[data-look="forest"] .scenebg svg.sc-forest.wide{display:block!important}
:root[data-look="dusk"] .scenebg svg.sc-dusk.narrow{display:none!important}
:root[data-look="dusk"] .scenebg svg.sc-dusk.wide{display:block!important}
:root[data-look="mono"] .scenebg svg.sc-mono.narrow{display:none!important}
:root[data-look="mono"] .scenebg svg.sc-mono.wide{display:block!important}
:root[data-look="night"] .scenebg svg.sc-night.narrow{display:none!important}
:root[data-look="night"] .scenebg svg.sc-night.wide{display:block!important}
}
:root[data-look="night"] body.scene{background:#03050C}

/* Night: navy to match the night sky */
:root[data-look="night"]{--bg:#0A0F1E;--surface:#121A2E;--ink:#FFFFFF;--muted:#A9B4CC;--line:#26324D;--accent:#8FB3FF;--accent-ink:#0A0F1E;--soft:#18223A;--deep:#070C1A;--deepink:#FFFFFF}
:root[data-look="night"] .topbar{background:linear-gradient(180deg,#0B1530,#1B2A4E)}
:root[data-look="night"] .hbar{background:rgba(0,0,0,.35)}
:root[data-look="night"] body.scene .card,:root[data-look="night"] body.scene .how,:root[data-look="night"] body.scene .fcard{background:#121A2E}
:root[data-look="night"] .fsafe{color:#FF8A8A}
/* Beach Day: light theme */
:root[data-look="beach"]{--bg:#FFFFFF;--surface:#FFFFFF;--ink:#0F2A2D;--muted:#4A6266;--line:#BFE3E3;--accent:#0E7C86;--accent-ink:#FFFFFF;--soft:#E8F6F6;--deep:#0B4F57;--deepink:#FFFFFF}
:root[data-look="beach"] .topbar{background:linear-gradient(180deg,#0B4F57,#13808A)}
:root[data-look="beach"] body.scene{background:#E2C48A}
:root[data-look="beach"] .hbar{background:rgba(255,255,255,.6);color:#0B3B40}
:root[data-look="beach"] .hbar img{filter:none}
:root[data-look="beach"] .hbar .mbtn{background:rgba(11,59,64,.12)}
:root[data-look="beach"] .hbar .mbtn svg{stroke:#0B3B40}
:root[data-look="beach"] .hcopy h1,:root[data-look="beach"] .hcopy p{color:#0B3B40;text-shadow:0 1px 6px rgba(255,255,255,.6)}
:root[data-look="beach"] body.scene h2.sec{color:#0B3B40;text-shadow:0 1px 6px rgba(255,255,255,.7)}
:root[data-look="beach"] body.scene .fine{color:#0B3B40;text-shadow:none}
:root[data-look="beach"] .scenebg svg:not(.sc){display:none!important}
:root[data-look="beach"] .scenebg svg.sc-beach.narrow{display:block!important}
@media (min-width:900px){:root[data-look="beach"] .scenebg svg.sc-beach.narrow{display:none!important}:root[data-look="beach"] .scenebg svg.sc-beach.wide{display:block!important}}

/* buttons on the landscape pages: solid so they read on any background */
body.scene .btn.ghost{background:var(--surface);color:var(--accent);border:2px solid var(--surface);box-shadow:0 4px 14px rgba(0,0,0,.25)}
body.scene .btn.ghost:hover{background:var(--soft);border-color:var(--soft)}
body.scene .btn.ghost .ico{stroke:currentColor}

/* frosted glass boxes on the landscape */
body.scene .fcard,body.scene .how.glass,body.scene .upc{background:rgba(10,8,8,.30);-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);border:1px solid rgba(255,255,255,.28);color:#fff;box-shadow:0 8px 28px rgba(0,0,0,.25)}
body.scene .fcard h3,body.scene .fmain h3{color:#fff}
body.scene .fcard .meta,body.scene .how.glass p,body.scene .how.glass .soon{color:rgba(255,255,255,.88)}
body.scene .how.glass h2{color:#fff}
body.scene .fcard .fsafe{color:#FFD2C2}
.upc{display:block;width:100%;text-align:left;border-radius:14px;padding:14px 16px;cursor:pointer;font:inherit}
.upc .upd{display:inline-block;font-size:12.5px;font-weight:700;letter-spacing:.02em;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.2);margin-bottom:8px}
.upc b{display:block;font-size:18px;line-height:1.25;margin-bottom:4px}
.upc .upm{font-size:14px;opacity:.88}
.upc:hover{background:rgba(10,8,8,.42)}
.agrid .upc{margin-top:10px}
@media (min-width:900px){.agrid .upc{margin-top:0}}
:root[data-look="beach"] body.scene .fcard,:root[data-look="beach"] body.scene .how.glass,:root[data-look="beach"] body.scene .upc{background:rgba(11,59,64,.42)}

/* trips, chats, reviews */
.glass2{background:var(--soft);border:1px solid var(--line);border-radius:14px}
.mt{padding:14px 16px;margin-top:12px}.mt b{display:block;font-size:18px;margin:6px 0 2px}.mt .upd{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.mt .btn{margin-top:10px}.mt .btnrow{display:flex;gap:8px;flex-wrap:wrap}
.chrow{display:block;width:100%;text-align:left;padding:14px 16px;margin-top:10px;color:var(--ink);font:inherit;cursor:pointer}
.chrow b{display:block;font-size:17px}.chrow span{display:block;color:var(--muted);font-size:14px}.chrow em{display:block;font-style:normal;font-weight:700;color:var(--accent);margin-top:6px}
.chrow[disabled]{cursor:default;opacity:.75}.chrow[disabled] em{color:var(--muted)}
.cmsgs{height:min(52vh,460px);overflow:auto;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;background:var(--surface)}
.cm{margin:8px 0;line-height:1.4}.cm small{color:var(--muted);font-size:12px}.cm.me{text-align:right}
.cm .tx{display:inline-block;max-width:85%;text-align:left;padding:8px 12px;border-radius:14px;background:var(--soft);word-break:break-word}.cm.me .tx{background:var(--accent);color:var(--accent-ink)}
.cform{display:flex;gap:8px;align-items:stretch;scroll-margin-bottom:110px}.cform input{flex:1 1 auto;width:auto;min-width:0}.cform .btn{width:auto;flex:0 0 auto}
.rv-stars{color:#E0A100;letter-spacing:2px;font-size:18px}
.rv-avg{font-weight:600;margin-bottom:8px}.rv{padding:10px 0;border-top:1px solid var(--line)}
.rv-pick{display:flex;gap:6px}.rv-star{font-size:34px;line-height:1;background:none;border:0;color:#E0A100;cursor:pointer;padding:2px}
.rv-ph{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.rv-th{position:relative;width:96px;height:96px;border-radius:10px;overflow:hidden;border:1px solid var(--line);padding:0;background:none}
.rv-th img{width:100%;height:100%;object-fit:cover;display:block}.rv-del{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px;line-height:1;cursor:pointer}
textarea{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;resize:vertical}
.apr{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}.apr img{width:140px;height:105px;object-fit:cover;border-radius:10px;flex:none;background:var(--soft)}.apr .btnrow{display:flex;gap:8px;margin-top:8px}
@media (min-width:900px){nav button{flex:0 0 130px}}

      if(!validEmail(state.email)){state.error="NZ Explorer is only open to University of Auckland students. Please use your "+DOMAIN+" address.";renderGate();return}
      if(!pw){state.error="Please enter your password.";renderGate();return}
      document.getElementById("go").disabled=true;
      auth.signInWithEmailAndPassword(state.email,pw).then(function(cred){
        var u=cred.user;
        if(!u.emailVerified){state.pending=u;state.step="inbox";state.error="";state.notice="Your email is not verified yet. Open the link we sent to "+u.email+".";renderGate();return}
        enter(u);
      }).catch(function(e){state.error=friendly(e);renderGate()});
    }
    document.getElementById("go").onclick=go;
    document.getElementById("pw").addEventListener("keydown",function(e){if(e.key==="Enter")go()});
    document.getElementById("em").addEventListener("keydown",function(e){if(e.key==="Enter")go()});
    document.getElementById("tosignup").onclick=function(){grab();state.mode="signup";state.error="";state.notice="";renderGate()};
    document.getElementById("forgot").onclick=function(){
      grab();state.error="";
      if(!validEmail(state.email)){state.error="Enter your "+DOMAIN+" email above first, then tap Forgot your password.";renderGate();return}
      auth.sendPasswordResetEmail(state.email).then(function(){
        state.notice="If an account exists for that email, a reset link is on its way.";renderGate();
      }).catch(function(e){
        var c=(e&&e.code)||"";
        if(c==="auth/too-many-requests"||c==="auth/network-request-failed"){state.error=friendly(e)}
        else{state.notice="If an account exists for that email, a reset link is on its way."}
        renderGate();
      });
    };
  }

  function renderInbox(){
    var h='<h2 style="margin-top:22px;font-size:24px">Check your inbox</h2><p style="margin-top:8px">'+esc(state.notice)+' Open the link in the email, then come back here. Check your spam folder too.</p>';

       '<p style="margin-top:12px"><button class="linkbtn" id="backin">Back to sign in</button></p>';
    app.innerHTML=gateShell(h);
    document.getElementById("cont").onclick=function(){
      var u=state.pending;if(!u){state.step="email";renderGate();return}
      u.reload().then(function(){
        if(u.emailVerified){enter(u)}
        else{state.error="Not verified yet. Open the link in your email first, then try again.";renderGate()}
      }).catch(function(e){state.error=friendly(e);renderGate()});
    };
    document.getElementById("resend").onclick=function(){
      var u=state.pending;if(!u)return;
      u.sendEmailVerification().then(function(){state.error="";state.notice="We sent the verification link again to "+u.email+".";renderGate()}).catch(function(e){state.error=friendly(e);renderGate()});
    };

      if(auth)auth.signOut();state.pending=null;state.step="email";state.mode="signin";state.error="";state.notice="";renderGate();

  if(auth){auth.onAuthStateChanged(function(u){
    if(u&&u.emailVerified&&validEmail(u.email)&&!state.user)enter(u);

  /* ---------- detail (Refs 2, 5, 6, 18, 28, 45, 12) ---------- */
  function mapsQ(q){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q)}
  function mapsDir(q){return "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(q)+"&travelmode=transit"}
  function ext(u,t,cls){return '<a class="'+(cls||"linkbtn")+'" href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(t)+'</a>'}
  function fmtDate(iso){var dt=new Date(iso+"T00:00:00");return dt.toLocaleDateString("en-NZ",{weekday:"short",day:"numeric",month:"short"})}
  function fmtTime(t){var p=t.split(":"),h=+p[0],m=p[1];return (h%12||12)+":"+m+(h<12?" am":" pm")}
  function srcList(arr){return arr.length?'<ul class="srcs">'+arr.map(function(u){return '<li><a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(u.replace(/^https?:\/\/(www\.)?/,"").slice(0,70))+'</a></li>'}).join("")+'</ul>':""}

      h+='<div class="btnrow">'+ext(mapsQ(a.name+", Auckland"),"Open in Maps","btn")+ext(mapsDir(a.name+", Auckland"),"Directions by public transport","btn ghost")+'</div><p class="muted" style="margin-top:8px">Exact start and finish points are still being confirmed for this activity.</p>';

  function need(x){return Math.ceil((x.max||0)/2)}
  function tripCard(x,mine,a){
    var n=x.joined||0,full=n>=x.max,need_=need(x),h='<div class="eat trip" data-id="'+esc(x.id)+'"><p><b>'+esc(fmtDate(x.date))+', '+esc(fmtTime(x.time))+'</b>'+(x.women?' <span class="tag">Females only</span>':' <span class="tag">All genders</span>')+(mine?' <span class="tag">You are going</span>':'')+'</p>'+
      '<p class="muted">Meet at '+esc(x.meeting)+(x.tbc?" (exact spot to be confirmed)":"")+'.</p>'+
      '<p>'+(n===0?'No one yet, be the first':esc(n)+' of '+esc(x.max)+' places taken')+(full?' (full)':'')+'</p>';
    h+='<div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="'+esc(need_)+'" aria-valuenow="'+Math.min(n,need_)+'" aria-label="Students joined toward contact details"><i style="width:'+Math.min(100,Math.round(100*n/Math.max(need_,1)))+'%"></i></div>';
    h+='<p class="muted">'+(n>=need_?'Enough students have joined ('+need_+' needed). Members can now see first names and any shared emails.':'Names and contact details unlock for members once '+need_+' of '+esc(x.max)+' places are taken'+(n>0?' ('+(need_-n)+' more needed)':'')+'.')+'</p>';
    if(mine){
      h+='<div class="who" id="who-'+esc(x.id)+'"></div><button class="btn ghost leave" data-id="'+esc(x.id)+'">Leave this trip</button><p class="muted">You can leave at any time.</p>';
    }else if(full){
      h+='<p class="muted">This trip is full. Check the other dates.</p>';
    }else{
      h+='<label class="share"><input type="checkbox" class="shr"> Share my university email with the group once enough students have joined</label><button class="btn join" data-id="'+esc(x.id)+'">Join this trip</button>';
    }
    return h+'<p class="muted tmsg" id="tm-'+esc(x.id)+'" role="status"></p></div>';
  }
  function loadTrips(a){
    var box=document.getElementById("trips");if(!box||!db||!state.uid)return;
    var today=new Date().toISOString().slice(0,10),col=db.collection("trips");
    var open=col.where("activityId","==",a.id).where("womenOnly","==",false).get();
    var women=col.where("activityId","==",a.id).where("womenOnly","==",true).get().then(function(r){return r},function(){return null});
    Promise.all([open,women]).then(function(res){
      var list=[];
      res.forEach(function(r,i){if(r)r.forEach(function(d){var x=d.data();x.id=d.id;x.women=(i===1);list.push(x)})});
      list=list.filter(function(x){return x.date>=today}).sort(function(p,q){return (p.date+p.time)<(q.date+q.time)?-1:1});
      return Promise.all(list.map(function(x){return col.doc(x.id).collection("members").doc(state.uid).get().then(function(m){x.mine=m.exists;return x},function(){x.mine=false;return x})}));
    }).then(function(list){
      if(state.sel===null||A[state.sel]!==a)return;
      if(!list.length){box.innerHTML="";return}
      var h='<h2>Upcoming trips</h2><p class="muted" style="margin-bottom:8px">Pick a date and join. Your name and email stay private until enough students have joined.</p>';
      list.forEach(function(x){h+=tripCard(x,x.mine,a)});
      box.innerHTML=h;
      Array.prototype.forEach.call(box.querySelectorAll(".join"),function(b){b.onclick=function(){joinTrip(b,a)}});
      Array.prototype.forEach.call(box.querySelectorAll(".leave"),function(b){b.onclick=function(){leaveTrip(b,a)}});
      list.forEach(function(x){if(x.mine&&(x.joined||0)>=need(x))loadWho(x)});
    }).catch(function(){box.innerHTML='<h2>Upcoming trips</h2><p class="muted">Trips could not be loaded right now. Please try again later.</p>'});
  }
  function loadWho(x){
    db.collection("trips").doc(x.id).collection("members").get().then(function(r){
      var el=document.getElementById("who-"+x.id);if(!el)return;
      var h='<p><b>Who is going</b></p>';
      r.forEach(function(d){var m=d.data();h+='<p>'+esc(m.name||"Student")+(d.id===state.uid?' (you)':'')+(m.email?' <span class="muted">'+esc(m.email)+'</span>':'')+'</p>'});
      h+='<p class="muted">Only students who ticked share show an email. Meet in the public place listed above.</p>';
      el.innerHTML=h;
    }).catch(function(){});
  }
  function joinTrip(b,a){
    var id=b.dataset.id,card=b.closest(".trip"),shr=card.querySelector(".shr"),msg=document.getElementById("tm-"+id);
    b.disabled=true;msg.textContent="Joining...";
    var first=(state.name||"").split(" ")[0]||"Student",m={name:first.slice(0,40),at:Date.now()};
    if(shr&&shr.checked)m.email=state.user;
    var batch=db.batch(),tr=db.collection("trips").doc(id);
    batch.set(tr.collection("members").doc(state.uid),m);
    batch.update(tr,{joined:firebase.firestore.FieldValue.increment(1)});
    batch.commit().then(function(){MY.list=null;loadTrips(a)}).catch(function(){b.disabled=false;msg.textContent="Could not join. The trip may be full, or you may not be able to join this one."});
  }
  function leaveTrip(b,a){
    var id=b.dataset.id,msg=document.getElementById("tm-"+id);b.disabled=true;
    var batch=db.batch(),tr=db.collection("trips").doc(id);
    batch.delete(tr.collection("members").doc(state.uid));
    batch.update(tr,{joined:firebase.firestore.FieldValue.increment(-1)});
    batch.commit().then(function(){MY.list=null;loadTrips(a)}).catch(function(){b.disabled=false;msg.textContent="Could not leave right now. Please try again."});
  }
  function profileView(){
    var h='<div class="view">'+topbar()+'<div class="pagehead"><h1>Your profile</h1><p>'+esc(state.name||"")+' '+esc(state.user||"")+'</p></div><div class="field"><label id="gl2">Gender</label><div class="chips" role="group" aria-labelledby="gl2">';
    GOPTS.forEach(function(g){h+='<button type="button" class="gchip" data-g="'+g[0]+'" aria-pressed="'+(state.gender===g[0])+'">'+esc(g[1])+'</button>'});
    h+='</div><p class="muted" style="margin-top:8px">Used only to decide which trips you can see, such as females only trips. It is never shown to other students. It is self declared and not checked.</p></div>';
    if(state.gmsg)h+='<p role="status" style="margin-top:12px"><b>'+esc(state.gmsg)+'</b></p>';
    h+='<div class="stack" style="margin-top:16px"><button class="btn" id="gsave">Save</button><button class="btn ghost" data-go="home">Back to home</button></div></div>';

  function bindProfile(){
    var pick=state.gender;
    Array.prototype.forEach.call(app.querySelectorAll(".gchip"),function(b){b.onclick=function(){pick=b.dataset.g;Array.prototype.forEach.call(app.querySelectorAll(".gchip"),function(c){c.setAttribute("aria-pressed",String(c===b))})}});
    var sv=document.getElementById("gsave");
    if(sv)sv.onclick=function(){
      if(!pick||!db||!state.uid){state.gmsg="Choose an option first.";render();return}
      db.collection("users").doc(state.uid).set({name:state.name||"",gender:pick}).then(function(){state.gender=pick;state.gmsg="Saved.";render()}).catch(function(){state.gmsg="Could not save right now. Please try again.";render()});

    if(MY.list===null)return h+'<p class="muted">Loading your chats...</p></div>';
    var up=MY.list.filter(function(x){return x.date>=todayISO()});
    if(!up.length)return h+'<p class="muted">Join a trip to get its group chat.</p><p style="margin-top:10px"><button class="btn" data-go="activities">Browse activities</button></p></div>';
    up.forEach(function(x){var a=A[actIndex(x.activityId)]||{name:"Trip"},n=x.joined||0,ok=n>=need(x);
      h+='<button class="chrow glass2" '+(ok?'data-chat="'+esc(x.id)+'"':'disabled')+'><b>'+esc(a.name)+'</b><span>'+esc(fmtDate(x.date))+' · '+esc(n)+' of '+esc(x.max)+' going</span><em>'+(ok?'Open chat':'Opens when '+(need(x)-n)+' more join')+'</em></button>'});
    return h+'</div>';
  }
  function bindChat(){
    var bk=document.getElementById("chatback");if(bk)bk.onclick=function(){state.chat=null;render()};
    var box=document.getElementById("cmsgs");if(!box||!db)return;
    var x=(MY.list||[]).filter(function(t){return t.id===state.chat})[0];if(!x)return;
    var col=db.collection("trips").doc(x.id).collection("messages"),form=document.getElementById("cform"),err=document.getElementById("cerr");
    stopChat();
    chatUnsub=col.orderBy("at").limitToLast(200).onSnapshot(function(snap){
      box.innerHTML="";
      if(snap.empty)box.innerHTML='<p class="muted">No messages yet. Say hi to the group.</p>';
      snap.forEach(function(d){var m=d.data(),row=document.createElement("div"),tx=document.createElement("span"),nm=document.createElement("small");
        row.className="cm"+(m.uid===state.uid?" me":"");tx.className="tx";tx.textContent=m.text||"";
        var dt=new Date(m.at||0);nm.textContent=(m.uid===state.uid?"You":(m.name||"Student"))+" · "+dt.toLocaleDateString("en-NZ",{day:"numeric",month:"short"})+" "+dt.toLocaleTimeString("en-NZ",{hour:"numeric",minute:"2-digit"});
        row.appendChild(tx);row.appendChild(document.createElement("br"));row.appendChild(nm);box.appendChild(row)});
      box.scrollTop=box.scrollHeight;
    },function(){box.innerHTML='<p class="muted">This chat is not available right now.</p>';form.style.display="none"});
    form.onsubmit=function(e){e.preventDefault();var inp=form.querySelector("input"),t=inp.value.trim();if(!t)return;var b=form.querySelector("button");b.disabled=true;err.textContent="";
      col.add({uid:state.uid,name:x.myName||"Student",text:t.slice(0,300),at:Date.now()}).then(function(){inp.value="";b.disabled=false;inp.focus()}).catch(function(){b.disabled=false;err.textContent="Could not send. Please try again."})};
  }
  function reviewView(){
    var x=(MY.list||[]).filter(function(t){return t.id===state.review})[0];
    var h='<div class="view">'+topbar()+'<button class="linkbtn back" id="rvback">Back to my trips</button>';
    if(!x)return h+'<p class="muted">Trip not found.</p></div>';
    var a=A[actIndex(x.activityId)]||{name:"Trip"},r=x.review||{};
    state.rv=state.rv||{stars:r.stars||0,text:r.text||"",photos:[]};
    var v=state.rv;
    h+='<div class="pagehead"><h1>Review your trip</h1><p>'+esc(a.name)+', '+esc(fmtDate(x.date))+'</p></div>';
    h+='<p><b>Your rating</b></p><div class="rv-pick" role="radiogroup" aria-label="Stars">';
    for(var i=1;i<=5;i++)h+='<button type="button" class="rv-star" data-st="'+i+'" aria-label="'+i+' star'+(i>1?'s':'')+'" aria-pressed="'+(v.stars>=i)+'">'+(v.stars>=i?'★':'☆')+'</button>';
    h+='</div><div class="field" style="margin-top:14px"><label for="rvt">What was it like? (optional)</label><textarea id="rvt" maxlength="500" rows="4">'+esc(v.text)+'</textarea></div>';
    h+='<p style="margin-top:14px"><b>Share photos</b> <span class="muted">(up to 3)</span></p><p class="muted">Photos go to the NZ Explorer team first. Once approved, they appear in this activity\'s photo gallery.'+(r.sent?' You have sent '+r.sent+' so far.':'')+'</p><div class="rv-ph">';
    v.photos.forEach(function(p,k){h+='<div class="rv-th"><img src="'+p+'" alt="Your photo '+(k+1)+'"><button type="button" class="rv-del" data-del="'+k+'" aria-label="Remove photo">×</button></div>'});
    h+='</div>'+(v.photos.length<3?'<label class="btn ghost" style="margin-top:8px">Add photos<input type="file" id="rvf" accept="image/*" multiple hidden></label>':'');
    h+='<p class="muted" id="rvmsg" role="status" style="margin-top:10px"></p><div class="stack" style="margin-top:12px"><button class="btn" id="rvsave">Save review</button></div></div>';
    return h;
  }
  function shrink(file){return new Promise(function(ok,bad){var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var m=900,w=im.width,h=im.height,k=Math.min(1,m/Math.max(w,h));var c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);var q=.6,u=c.toDataURL("image/jpeg",q);while(u.length>280000&&q>.3){q-=.1;u=c.toDataURL("image/jpeg",q)}ok(u)};im.onerror=bad;im.src=fr.result};fr.onerror=bad;fr.readAsDataURL(file)})}
  function bindReview(){
    var v=state.rv,msg=document.getElementById("rvmsg");
    var bk=document.getElementById("rvback");if(bk)bk.onclick=function(){state.review=null;state.rv=null;state.tab="trips";render()};
    Array.prototype.forEach.call(app.querySelectorAll(".rv-star"),function(b){b.onclick=function(){v.text=document.getElementById("rvt").value;v.stars=+b.dataset.st;render()}});
    Array.prototype.forEach.call(app.querySelectorAll(".rv-del"),function(b){b.onclick=function(){v.text=document.getElementById("rvt").value;v.photos.splice(+b.dataset.del,1);render()}});
    var f=document.getElementById("rvf");if(f)f.onchange=function(){v.text=document.getElementById("rvt").value;var files=Array.prototype.slice.call(f.files,0,3-v.photos.length);msg.textContent="Preparing photos...";
      Promise.all(files.map(shrink)).then(function(us){v.photos=v.photos.concat(us).slice(0,3);render()}).catch(function(){msg.textContent="One of those photos could not be read. Try a JPG or PNG."})};
    var sv=document.getElementById("rvsave");if(sv)sv.onclick=function(){
      v.text=document.getElementById("rvt").value.trim();
      if(!v.stars){msg.textContent="Pick a star rating first.";return}
      var x=(MY.list||[]).filter(function(t){return t.id===state.review})[0];if(!x)return;
      sv.disabled=true;msg.textContent="Saving...";
      var prev=(x.review&&x.review.sent)||0,ph=v.photos.slice(0,3);
      var doc={uid:state.uid,name:(x.myName||"Student").slice(0,40),activityId:x.activityId,tripId:x.id,stars:v.stars,text:v.text.slice(0,500),sent:prev+ph.length,at:Date.now()};
      db.collection("reviews").doc(x.id+"_"+state.uid).set(doc).then(function(){
        return Promise.all(ph.map(function(p){return db.collection("photoSubs").add({uid:state.uid,name:doc.name,activityId:x.activityId,tripId:x.id,data:p,status:"pending",at:Date.now()})}));
      }).then(function(){x.review=doc;state.review=null;state.rv=null;state.tab="trips";state.flash=ph.length?"Thanks! Your review is saved and your photos are waiting for approval.":"Thanks! Your review is saved.";render()}).catch(function(){sv.disabled=false;msg.textContent="Could not save. If you added photos, try fewer or smaller ones."});
    };
  }
  function reviewsSection(a){return db?'<div class="section" id="reviews"><h2>Reviews</h2><p class="muted">Loading reviews...</p></div>':''}
  function loadReviews(a){
    var box=document.getElementById("reviews");if(!box||!db)return;
    db.collection("reviews").where("activityId","==",a.id).get().then(function(r){
      if(state.sel===null||A[state.sel]!==a)return;
      var list=[];r.forEach(function(d){list.push(d.data())});list.sort(function(p,q){return (q.at||0)-(p.at||0)});
      var h='<h2>Reviews</h2>';
      if(!list.length){box.innerHTML=h+'<p class="muted">No reviews yet. After a trip, rate it from My trips.</p>';return}
      var avg=list.reduce(function(s,x){return s+(x.stars||0)},0)/list.length;
      h+='<p class="rv-avg"><span class="rv-stars">'+stars(avg)+'</span> '+avg.toFixed(1)+' from '+list.length+' review'+(list.length>1?'s':'')+'</p>';
      list.slice(0,10).forEach(function(x){h+='<div class="rv"><p><span class="rv-stars">'+stars(x.stars)+'</span> <b>'+esc(x.name||"Student")+'</b> <span class="muted">'+esc(new Date(x.at||0).toLocaleDateString("en-NZ",{day:"numeric",month:"short"}))+'</span></p>'+(x.text?'<p>'+esc(x.text)+'</p>':'');
        h+='</div>'});
      box.innerHTML=h;
    }).catch(function(){box.innerHTML='<h2>Reviews</h2><p class="muted">Reviews could not load right now.</p>'});
  }
  var OWNER="aban600@aucklanduni.ac.nz";
  function isOwnerUser(){return (state.user||"").toLowerCase()===OWNER}
  var APPROVED={};
  function loadApprovedPhotos(a){
    var gt=document.getElementById("gt");if(!db||!gt)return;
    db.collection("photoSubs").where("activityId","==",a.id).where("status","==","approved").get().then(function(r){
      if(state.sel===null||A[state.sel]!==a)return;var g=document.getElementById("gt");if(!g)return;
      r.forEach(function(d){var p=d.data();if(!/^data:image\/(jpeg|png);base64,/.test(p.data||""))return;var im=document.createElement("img");im.src=p.data;im.alt="Photo from "+(p.name||"a student");im.loading="lazy";g.appendChild(im)});
      var n=g.children.length,gc=document.getElementById("gc");
      if(n>1&&!document.getElementById("gp")){var wrap=g.parentNode;wrap.insertAdjacentHTML("beforeend",'<button class="ga gp" id="gp" aria-label="Previous photo">&#8249;</button><button class="ga gn" id="gnx" aria-label="Next photo">&#8250;</button><span class="gc" id="gc">1 / '+n+'</span>');bindGallery()}
      else if(gc)gc.textContent=(Math.round(g.scrollLeft/g.clientWidth)+1)+" / "+n;
    }).catch(function(){});
  }
  function approvalsView(){
    var h='<div class="view">'+topbar()+'<div class="pagehead"><h1>Photo approvals</h1><p>Photos students sent with their reviews. Approved photos join that activity\'s gallery.</p></div>';
    if(!isOwnerUser())return h+'<p class="muted">Only the NZ Explorer team can see this page.</p></div>';
    return h+'<div id="apq"><p class="muted">Loading photos...</p></div></div>';
  }
  function bindApprovals(){
    var box=document.getElementById("apq");if(!box||!db)return;
    db.collection("photoSubs").where("status","==","pending").get().then(function(r){
      var list=[];r.forEach(function(d){var p=d.data();p.id=d.id;list.push(p)});list.sort(function(p,q){return (p.at||0)-(q.at||0)});
      if(!list.length){box.innerHTML='<p class="muted">Nothing waiting. New photos will appear here.</p>';return}
      var h='';list.forEach(function(p){var a=A[actIndex(p.activityId)]||{name:p.activityId};
        h+='<div class="apr"><img alt="Photo waiting for approval"><div><b>'+esc(a.name)+'</b><p class="muted">From '+esc(p.name||"Student")+', '+esc(new Date(p.at||0).toLocaleDateString("en-NZ",{day:"numeric",month:"short"}))+'</p><div class="btnrow"><button class="btn" data-ap="'+esc(p.id)+'">Approve</button><button class="btn ghost" data-rj="'+esc(p.id)+'">Reject</button></div></div></div>'});
      box.innerHTML=h;
      Array.prototype.forEach.call(box.querySelectorAll(".apr img"),function(im,k){if(/^data:image\/(jpeg|png);base64,/.test(list[k].data||""))im.src=list[k].data});
      function act(id,st,b){b.disabled=true;db.collection("photoSubs").doc(id).update({status:st}).then(function(){var c=b.closest(".apr");c.innerHTML='<p class="muted">'+(st==="approved"?"Approved. It now shows in the activity gallery.":"Rejected.")+'</p>'}).catch(function(){b.disabled=false})}
      Array.prototype.forEach.call(box.querySelectorAll("[data-ap]"),function(b){b.onclick=function(){act(b.dataset.ap,"approved",b)}});
      Array.prototype.forEach.call(box.querySelectorAll("[data-rj]"),function(b){b.onclick=function(){act(b.dataset.rj,"rejected",b)}});
    }).catch(function(){box.innerHTML='<p class="muted">Could not load photos. Check the Firestore rules are published.</p>'});
  }
  function bindGallery(){var gt=document.getElementById("gt");if(!gt)return;var go=function(d){var n=gt.children.length,w=gt.clientWidth,k=Math.round(gt.scrollLeft/w)+d;if(k<0)k=n-1;if(k>=n)k=0;gt.scrollTo({left:k*w,behavior:"smooth"})};gt.onscroll=function(){var gc=document.getElementById("gc");if(gc)gc.textContent=(Math.round(gt.scrollLeft/gt.clientWidth)+1)+" / "+gt.children.length};var gp=document.getElementById("gp"),gx=document.getElementById("gnx");if(gp)gp.onclick=function(){go(-1)};if(gx)gx.onclick=function(){go(1)}}
  function render(){
    stopChat();
    if(!state.user){renderGate();return}
    nav.classList.remove("hidden");waves.classList.add("withnav");
    var v=state.tab==="home"?homeView():state.tab==="safety"?safetyView():state.tab==="profile"?profileView():state.tab==="look"?lookView():state.tab==="trips"?(state.review?reviewView():tripsView()):state.tab==="chats"?chatsView():state.tab==="approvals"?approvalsView():(state.sel!==null?detailView():listView());
    app.innerHTML=v;
    Array.prototype.forEach.call(nav.querySelectorAll("button"),function(b){
      if(b.dataset.tab===state.tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");
    });
    bind();
    if(state.tab==="activities"&&state.sel!==null){loadTrips(A[state.sel]);loadWeather(A[state.sel])}
    if(state.tab==="profile")bindProfile();
    if(state.tab==="look")bindLook();
    if((state.tab==="trips"||state.tab==="chats")&&MY.list===null&&!MY.loading&&db&&state.uid){MY.loading=true;loadMyTrips(function(){MY.loading=false;if(state.tab==="trips"||state.tab==="chats")render()})}
    if(state.tab==="chats"&&state.chat)bindChat();
    if(state.tab==="trips"&&state.review)bindReview();
    if(state.tab==="approvals")bindApprovals();
    if(state.tab==="activities"&&state.sel!==null){loadReviews(A[state.sel]);loadApprovedPhotos(A[state.sel])}
    if(state.tab==="home")loadUpcoming();
    window.scrollTo(0,0);
  }
  function rerenderList(){app.innerHTML=listView();bind()}
  function bind(){
    Array.prototype.forEach.call(app.querySelectorAll(".mbtn"),function(b){b.onclick=function(e){e.stopPropagation();var l=b.nextElementSibling,open=l.hidden;l.hidden=!open;b.setAttribute("aria-expanded",String(open))}});
    var o=document.getElementById("out");if(o)o.onclick=function(){if(auth)auth.signOut();state.user=null;state.name="";state.mode="signin";state.step="email";state.email="";state.error="";state.profile={name:"",age:"",gender:""};state.gender="";state.uid=null;state.gmsg="";state.sel=null;state.f={dur:"Any",diff:"Any"};render()};
    Array.prototype.forEach.call(app.querySelectorAll("[data-go]"),function(b){b.onclick=function(){state.tab=b.dataset.go;state.sel=null;state.chat=null;state.review=null;if(state.tab==="trips"||state.tab==="chats")MY.list=null;render()}});
    Array.prototype.forEach.call(app.querySelectorAll("[data-chat]"),function(b){b.onclick=function(){state.tab="chats";state.chat=b.dataset.chat;state.sel=null;render()}});
    Array.prototype.forEach.call(app.querySelectorAll("[data-review]"),function(b){b.onclick=function(){state.tab="trips";state.review=b.dataset.review;state.rv=null;state.sel=null;render()}});
    Array.prototype.forEach.call(app.querySelectorAll(".row"),function(b){b.onclick=function(){state.sel=+b.dataset.i;render()}});
    Array.prototype.forEach.call(app.querySelectorAll("[data-feat]"),function(b){b.onclick=function(){state.tab="activities";state.sel=+b.dataset.feat;render()}});
    Array.prototype.forEach.call(app.querySelectorAll(".chip"),function(b){b.onclick=function(){state.f[b.dataset.f]=b.dataset.v;rerenderList()}});
    Array.prototype.forEach.call(app.querySelectorAll("[data-clear]"),function(b){b.onclick=function(){state.f={dur:"Any",diff:"Any"};rerenderList()}});
    bindGallery();
    var bk=document.getElementById("bk");if(bk)bk.onclick=function(){state.sel=null;render()};
  }
  document.addEventListener("click",function(e){if(!e.target.closest(".umenu"))Array.prototype.forEach.call(document.querySelectorAll(".mlist"),function(l){l.hidden=true})});
  document.addEventListener("keydown",function(e){if(e.key==="Escape")Array.prototype.forEach.call(document.querySelectorAll(".mlist"),function(l){l.hidden=true})});
  nav.addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;state.tab=b.dataset.tab;state.sel=null;state.chat=null;state.review=null;if(state.tab==="trips"||state.tab==="chats")MY.list=null;render();
  });

  render();
})();

</script>
</body>
