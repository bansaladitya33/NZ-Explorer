<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NZ Explorer trip upload</title>
<style>body{font-family:system-ui,sans-serif;max-width:480px;margin:32px auto;padding:0 16px;line-height:1.5}input,button{font:inherit;padding:10px;width:100%;margin:6px 0;box-sizing:border-box}button{background:#000;color:#fff;border:0;border-radius:8px}pre{background:#f0f0f0;padding:10px;white-space:pre-wrap}</style>

<h1>Upload trips</h1>
<p>One off page for the site owner. Sign in with your verified University email, then upload the 20 planned trips. Delete this file from GitHub afterwards.</p>

<button id="go">Sign in and upload trips</button>

firebase.initializeApp(window.FIREBASE_CONFIG);
document.getElementById("go").onclick=function(){
  out.textContent="Signing in...";
  firebase.auth().signInWithEmailAndPassword(document.getElementById("em").value.trim(),document.getElementById("pw").value).then(function(c){
    if(!c.user.emailVerified){throw new Error("This account is not verified yet.")}
    return c.user.getIdToken(true);
  }).then(function(){
    var db=firebase.firestore(),batch=db.batch();
    TRIPS.forEach(function(t){var id=t.id;var d=Object.assign({},t);delete d.id;batch.set(db.collection("trips").doc(id),d)});
    return batch.commit();
  }).then(function(){log("Done. "+TRIPS.length+" trips uploaded.")}).catch(function(e){log("Failed: "+(e.code||"")+" "+e.message)});
};
